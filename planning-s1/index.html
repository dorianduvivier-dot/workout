    V("L'attente dynamique permet d'occuper les joueurs qui ne servent pas.", true, "Ils travaillent la gestuelle en attendant."),
    Q("Effet privilégié pour sécuriser le service :", ["Coupé", "Lifté", "Slicé à plat", "Sans effet"], 1, "Le cours s'est concentré sur l'effet lifté."),
    Q("Un « critère de réussite » doit être :", ["Seulement qualitatif", "Quantitatif et/ou qualitatif, pour savoir si le but est atteint", "Laissé au joueur", "Toujours de 100 %"], 1, "Ex. : 60 % de services dans la zone.")
  ],
  sa: [
    Q("Nombre de déficients visuels dans le monde selon le cours :", ["32 millions", "155 millions", "1 milliard", "12 millions"], 1, "Dont 32 millions d'aveugles."),
    Q("L'albinisme est dû à :", ["Une opacification du cristallin", "Un déficit de mélanine", "Une pression sur le nerf optique", "Un traumatisme"], 1, "Photophobie, nystagmus, strabisme."),
    Q("Dépistage du glaucome recommandé à partir de :", ["10 ans", "25 ans", "40 ans", "70 ans"], 2, "Le champ visuel perdu ne se récupère pas."),
    Q("Année de création de la FFH :", ["1901", "1960", "1977", "2001"], 2, "Association loi 1901, reconnue d'utilité publique."),
    Q("Nombre de personnes en situation de handicap en France :", ["2 millions", "12 millions", "35 000", "30 millions"], 1, "Seulement 35 000 licenciés FFH."),
    V("Au goalball, les valides peuvent jouer avec les déficients visuels jusqu'au championnat de France (2 voyants max).", true, "Tous les joueurs portent un masque."),
    V("La FFSA s'occupe des handicaps moteurs.", false, "La FFSA gère les handicaps mental, psychique et neurodéveloppemental ; la FFH le moteur et le sensoriel."),
    Q("Agénésie signifie :", ["Amputation", "Malformation (absence de développement d'un membre)", "Paralysie", "Cécité"], 1, "Cité dans le cours 2."),
    Q("Prévalence de l'addiction au sport selon les sports :", ["0,1 %", "3 à 30 %", "50 %", "90 %"], 1, "Plutôt des femmes mais aussi des hommes."),
    Q("Moment clé où surveiller un jeune sportif :", ["Les vacances d'été uniquement", "Le passage au haut niveau, un changement de club, la période scolaire", "Le jour de la compétition seulement", "Jamais"], 1, "Avec une prise en charge pluridisciplinaire."),
    Q("Hormones perturbées par le cercle anorexie + sport intensif :", ["Insuline et glucagon", "Cortisol et leptine", "Mélatonine et sérotonine", "Testostérone et EPO"], 1, "Cité dans le cours 3."),
    V("Le sport peut servir d'automédication psychique.", true, "Les endorphines agissent comme des opiacés naturels.")
  ],
  co: [
    Q("Où est née la course d'orientation ?", ["En France", "En Scandinavie, fin du XIXe siècle", "Aux États-Unis", "En Suisse en 1970"], 1, "Utilisée d'abord par les militaires."),
    Q("Création de la FFCO :", ["1900", "1945", "1970", "2021"], 2, "Environ 10 000 licenciés."),
    Q("Sur la carte, le blanc indique une végétation :", ["Impénétrable", "Pénétrable à 100 %", "Marécageuse", "Interdite"], 1, "Le vert foncé = 0 % de pénétrabilité."),
    Q("PM signifie :", ["Point de manœuvre", "Poste manquant", "Parcours mixte", "Point majeur"], 1, "Synonyme d'élimination en compétition."),
    Q("Le point d'attaque correspond :", ["Au départ", "Au dernier point d'appui avant la balise", "À l'arrivée", "À une zone dangereuse"], 1, "Il a peu de sens en terrain urbain."),
    Q("Allure « orange » des feux tricolores :", ["80-85 % VMA", "65-70 % VMA", "Marche", "100 % VMA"], 1, "Intéressante pour la condition physique et la plasticité cérébrale."),
    V("La course d'orientation est une activité de pleine nature.", false, "Le cours précise qu'elle n'en est pas une (activités inventées pour le milieu naturel)."),
    V("La boussole n'est pas utilisée en début d'apprentissage ni en APAS.", true, "Elle sert à suivre une direction sans ligne."),
    Q("Mode de confrontation conseillé pour les débutants :", ["Contre-la-montre uniquement", "Mass start, relais, chasse ou défi", "Course de nuit", "Course en solitaire sans carte"], 1, "Le contre-la-montre ne met pas en confrontation directe."),
    Q("La CO de précision s'adresse surtout :", ["Aux élites", "Aux personnes à mobilité réduite", "Aux enfants de 6 ans", "Aux militaires"], 1, "Faible taux de pratique (accès et terrain technique)."),
    Q("Les 4 attitudes spécifiques en CO :", ["Vitesse, force, endurance, souplesse", "Accepter la pression temporelle, concentration, sécurité, respect de l'environnement", "Lire, courir, sauter, nager", "Écoute, partage, autonomie, plaisir"], 1, "La pression temporelle n'est pas adaptée à l'APAS.")
  ]
};

</script>
<script>
(function () {
  "use strict";
  const STORE_KEY = "planning-s1-las2-v2";
  const DEFAULT_START = "2026-11-02";
  const DAY_NAMES = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"];
  const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const FULL = { R1: ["08:00", "08:15"], A: ["08:15", "10:00"], B: ["10:15", "12:00"], R2: ["14:00", "14:15"], C: ["14:15", "16:00"], D: ["16:15", "18:00"] };
  const BOX_COLORS = ["var(--warn)", "color-mix(in srgb, var(--good) 35%, var(--line))", "color-mix(in srgb, var(--good) 65%, var(--line))", "var(--good)"];

  /* ---------- state ---------- */
  let state = { done: {}, boxes: {}, start: DEFAULT_START };
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  const CH = {}; CHAPTERS.forEach(c => { CH[c.id] = c; if (typeof EXTRA !== "undefined" && EXTRA[c.id]) c.cards = c.cards.concat(EXTRA[c.id]); });
  const subjOf = c => SUBJECTS[c.subj];
  const cardId = (ch, i) => ch + "." + i;

  /* ---------- dates ---------- */
  function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function startDate() { return parseDate(state.start || DEFAULT_START); }
  function dateOf(g) { const s = startDate(); const w = Math.floor(g / 5), d = g % 5; const r = new Date(s); r.setDate(s.getDate() + w * 7 + d); return r; }
  function fmt(d) { return d.getDate() + " " + MONTHS[d.getMonth()]; }
  function todayIndex() {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    for (let g = 0; g < 20; g++) { if (dateOf(g).getTime() === t.getTime()) return g; }
    return -1;
  }
  function snapMonday(d) { const day = (d.getDay() + 6) % 7; const r = new Date(d); r.setDate(d.getDate() - day); return r; }

  /* ---------- build the plan ---------- */
  // Créneaux de travail possibles : lun., mer., jeu. A-D ; mar., ven. C-D seulement (matin libre).
  const POS_ORDER = { A: 1, B: 2, C: 3, D: 4 };
  function posLabels(d) { return (d === 1 || d === 4) ? ["C", "D"] : ["A", "B", "C", "D"]; }
  function posKey(w, d, lbl) { return "w" + w + "d" + d + lbl; }
  function parsePos(k) { const m = /^w(\d)d(\d)([ABCD])$/.exec(k); return m ? { w: +m[1], d: +m[2], lbl: m[3] } : null; }
  function baseCode(w, d, lbl) {
    const blocks = SCHEDULE[w][d];
    const labels = blocks.length === 4 ? ["A", "B", "C", "D"] : ["C", "D"];
    const i = labels.indexOf(lbl);
    return i >= 0 ? blocks[i] : null;
  }
  function codeAt(w, d, lbl) {
    const k = posKey(w, d, lbl);
    if (state.layout && Object.prototype.hasOwnProperty.call(state.layout, k)) return state.layout[k];
    return baseCode(w, d, lbl);
  }
  const DAYS = [];
  const completion = {}; // chapter id -> day index of its last session (+0.5 if afternoon)
  const sessionsOf = {}; // chapter id -> [{g, part, key, lbl}]
  const STUDY_KEYS = [];
  function rappelChapters(g, which) {
    const out = [];
    const full = DAYS[g].full;
    const want = which === "R1" ? [[1, "Hier"], [3, "J-3"]] : (full ? [[0, "Ce matin"], [7, "J-7"], [14, "J-14"]] : [[1, "Hier"], [3, "J-3"], [7, "J-7"], [14, "J-14"]]);
    Object.keys(completion).forEach(id => {
      const c = completion[id]; const day = Math.floor(c); const afternoon = c % 1 !== 0;
      want.forEach(([lag, label]) => {
        if (lag === 0) { if (day === g && !afternoon) out.push({ id, label }); }
        else if (g - day === lag) out.push({ id, label });
      });
    });
    out.sort((a, b) => completion[a.id] - completion[b.id]);
    return out;
  }
  function buildPlan() {
    DAYS.length = 0; STUDY_KEYS.length = 0;
    Object.keys(completion).forEach(k => delete completion[k]);
    Object.keys(sessionsOf).forEach(k => delete sessionsOf[k]);
    for (let w = 0; w < 4; w++) {
      for (let d = 0; d < 5; d++) {
        const g = w * 5 + d;
        const slots = [];
        posLabels(d).forEach(lbl => {
          const code = codeAt(w, d, lbl);
          if (!code) return;
          const key = posKey(w, d, lbl);
          const items = code.split("+").map(part => {
            if (REVIEWS[part]) return { review: part };
            const [id, p] = part.split(":");
            return { ch: id, part: Number(p) };
          });
          items.forEach(it => { if (it.ch) (sessionsOf[it.ch] = sessionsOf[it.ch] || []).push({ g, part: it.part, key, lbl, it }); });
          slots.push({ key, kind: "study", lbl, time: FULL[lbl], items });
          STUDY_KEYS.push(key);
        });
        const full = slots.some(s => s.lbl === "A" || s.lbl === "B");
        DAYS.push({ g, w, d, full, slots, morning: posLabels(d).length === 4 });
      }
    }
    // Les parties sont renumérotées dans l'ordre où elles tombent dans le planning,
    // et le chapitre compte comme vu après sa dernière séance.
    Object.keys(sessionsOf).forEach(id => {
      const list = sessionsOf[id].sort((a, b) => (a.g * 10 + POS_ORDER[a.lbl]) - (b.g * 10 + POS_ORDER[b.lbl]));
      list.forEach((s, i) => { s.part = i + 1; s.it.part = i + 1; });
      const last = list[list.length - 1];
      completion[id] = last.g + (last.lbl === "C" || last.lbl === "D" ? 0.5 : 0);
    });
    DAYS.forEach(day => {
      const g = day.g;
      if (day.full) day.slots.unshift({ key: posKey(day.w, day.d, "R1").replace("dR", "dR"), kind: "rappel", lbl: "R1", time: FULL.R1, list: rappelChapters(g, "R1") });
      const idx = day.slots.findIndex(s => s.lbl === "C" || s.lbl === "D");
      if (idx >= 0) day.slots.splice(idx, 0, { key: "w" + day.w + "d" + day.d + "R2", kind: "rappel", lbl: "R2", time: FULL.R2, list: rappelChapters(g, "R2") });
    });
  }
  // Nouvelle version du planning de base : on garde les déplacements de la semaine 1, on oublie ceux des semaines suivantes.
  if (state.schedVer !== SCHEDULE_VERSION) {
    if (state.layout) Object.keys(state.layout).forEach(k => { if (!/^w0/.test(k)) delete state.layout[k]; });
    state.schedVer = SCHEDULE_VERSION; save();
  }
  buildPlan();

  /* ---------- déplacement des blocs ---------- */
  let moving = null; let resetArmed = false;
  function moveSlot(from, to) {
    if (!from || !to || from === to) return;
    const a = parsePos(from), b = parsePos(to); if (!a || !b) return;
    if (!posLabels(b.d).includes(b.lbl)) return;
    const ca = codeAt(a.w, a.d, a.lbl), cb = codeAt(b.w, b.d, b.lbl);
    state.layout = state.layout || {};
    state.layout[to] = ca; state.layout[from] = cb;
    // l'état « fait » suit le bloc
    const da = !!state.done[from], db = !!state.done[to];
    if (db) state.done[from] = true; else delete state.done[from];
    if (da) state.done[to] = true; else delete state.done[to];
    // nettoyer les entrées identiques au planning d'origine
    [from, to].forEach(k => { const p = parsePos(k); if (state.layout[k] === baseCode(p.w, p.d, p.lbl)) delete state.layout[k]; });
    save(); buildPlan();
  }
  function emptyCell(k, extraStyle) {
    return '<div class="off drop' + (moving ? " target" : "") + '" data-pos="' + k + '"' + (extraStyle ? ' style="' + extraStyle + '"' : "") + ">" + (moving ? "Placer ici" : "Libre") + "</div>";
  }

  /* ---------- helpers ---------- */
  function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]); }
  function slotInfo(slot) {
    // returns {title, subj, color, partLabel}
    if (slot.items.length === 1 && slot.items[0].review) {
      const r = REVIEWS[slot.items[0].review];
      return { title: r.title, color: "rev", tag: r.type === "annale" ? "Annale" : (r.type === "bilan" ? "Bilan" : "Révision") };
    }
    const parts = slot.items.map(it => CH[it.ch]);
    const c0 = parts[0];
    const title = slot.items.map(it => { const c = CH[it.ch]; return c.title + (c.parts > 1 ? " (" + it.part + "/" + c.parts + ")" : ""); }).join(" + ");
    return { title, color: SUBJECTS[c0.subj].color, tag: SUBJECTS[c0.subj].name };
  }
  function findSlot(key) { for (const d of DAYS) for (const s of d.slots) if (s.key === key) return { day: d, slot: s }; return null; }
  function updateMeter() {
    const total = STUDY_KEYS.length; const n = STUDY_KEYS.filter(k => state.done[k]).length;
    document.getElementById("doneCount").textContent = n + "/" + total;
    document.getElementById("barFill").style.width = (100 * n / total) + "%";
  }
  function rangeText() {
    const a = dateOf(0), b = dateOf(19);
    document.getElementById("range").textContent = "4 semaines · lun. " + fmt(a) + " → ven. " + fmt(b) + " " + b.getFullYear() + " · lun., mer., jeu. 8h-18h · mar., ven. 14h-18h";
  }

  function slotButton(slot, opts) {
    opts = opts || {};
    const done = !!state.done[slot.key];
    if (slot.kind === "rappel") {
      const names = slot.list.map(x => CH[x.id].title);
      const sub = names.length ? slot.list.map(x => esc(x.label) + " : " + esc(CH[x.id].title)).slice(0, 3).join("<br>") + (names.length > 3 ? "<br>+ " + (names.length - 3) + " autre(s)" : "") : "Pas encore de chapitre vu : lance-toi !";
      return '<button class="slot rappel' + (done ? " done" : "") + '" data-key="' + slot.key + '">' +
        '<div class="meta"><span class="time">' + slot.time[0] + "-" + slot.time[1] + '</span><span class="check">' + (done ? "✓" : "") + "</span></div>" +
        '<div class="ttl">Piqûre de rappel · 15 min</div><div class="sub">' + sub + "</div></button>";
    }
    const info = slotInfo(slot);
    return '<button class="slot study s-' + info.color + (done ? " done" : "") + (moving === slot.key ? " picked" : "") + '" data-key="' + slot.key + '" data-pos="' + slot.key + '" draggable="true">' +
      '<div class="meta"><span class="tag">' + esc(info.tag) + '</span><span class="check">' + (done ? "✓" : "") + "</span></div>" +
      '<div class="ttl">' + esc(info.title) + "</div>" +
      '<span class="time">' + slot.time[0] + "-" + slot.time[1] + "</span></button>";
  }

  /* ---------- views ---------- */
  let curWeek = 0; let curDay = 0; let ti = -1;
  function locateToday() {
    ti = todayIndex();
    if (ti >= 0) { curDay = ti; }
    else {
      const t = new Date(); t.setHours(0, 0, 0, 0);
      curDay = 19;
      for (let g = 0; g < 20; g++) { if (dateOf(g) > t) { curDay = g; break; } }
    }
    curWeek = Math.floor(curDay / 5);
  }
  locateToday();

  function renderWeek() {
    const el = document.getElementById("v-semaine");
    const w = curWeek;
    let chips = '<div class="chips" role="group" aria-label="Choisir la semaine">';
    for (let i = 0; i < 4; i++) chips += '<button class="chip" data-week="' + i + '" aria-pressed="' + (i === w) + '">Semaine ' + (i + 1) + "</button>";
    chips += "</div>";
    const days = DAYS.slice(w * 5, w * 5 + 5);
    // desktop grid
    let grid = '<div class="week"><div></div>';
    days.forEach(d => { grid += '<div class="dh' + (d.g === ti ? " today" : "") + '">' + DAY_NAMES[d.d] + "<small>" + fmt(dateOf(d.g)) + "</small></div>"; });
    const rows = [["R1", "08:00"], ["A", "08:15"], ["B", "10:15"], ["L", "12:00"], ["R2", "14:00"], ["C", "14:15"], ["D", "16:15"]];
    rows.forEach(([lbl, t], ri) => {
      grid += '<div class="rl" style="grid-column:1;grid-row:' + (ri + 2) + '">' + t + "</div>";
      days.forEach((d, di) => {
        const col = di + 2, row = ri + 2;
        if (lbl === "L") { grid += '<div class="lunch" style="grid-column:' + col + ";grid-row:" + row + '">Pause 12h-14h</div>'; return; }
        if (!d.morning && lbl === "R1") { grid += '<div class="off" style="grid-column:' + col + ";grid-row:" + row + ' / span 3">Matin libre<br>(pas de travail)</div>'; return; }
        if (!d.morning && (lbl === "A" || lbl === "B")) return;
        const s = d.slots.find(x => x.lbl === lbl);
        if (!s) {
          if (lbl === "R1" || lbl === "R2") { grid += '<div class="lunch" style="grid-column:' + col + ";grid-row:" + row + '">Pas de rappel</div>'; return; }
          grid += emptyCell(posKey(d.w, d.d, lbl), "grid-column:" + col + ";grid-row:" + row); return;
        }
        grid += '<div style="grid-column:' + col + ";grid-row:" + row + ';display:grid">' + slotButton(s) + "</div>";
      });
    });
    grid += "</div>";
    // mobile list
    let mob = '<div class="mobile-week">';
    days.forEach(d => {
      mob += '<div class="mday"><h3>' + DAY_NAMES[d.d] + "<small>" + fmt(dateOf(d.g)) + (d.morning ? "" : " · matin libre") + '</small></h3><div class="list">';
      ["R1", "A", "B", "R2", "C", "D"].forEach(lbl => {
        if (!d.morning && (lbl === "R1" || lbl === "A" || lbl === "B")) return;
        const s = d.slots.find(x => x.lbl === lbl);
        if (s) mob += slotButton(s);
        else if (lbl !== "R1" && lbl !== "R2") mob += emptyCell(posKey(d.w, d.d, lbl));
        if (lbl === "B") mob += '<div class="lunch">Pause 12h-14h</div>';
      });
      mob += "</div></div>";
    });
    mob += "</div>";
    el.innerHTML = '<div class="view-head"><div><h2>Semaine ' + (w + 1) + " · " + fmt(dateOf(w * 5)) + " → " + fmt(dateOf(w * 5 + 4)) + '</h2><p>Blocs de travail de 1h45 avec 15 min de pause. Chaque demi-journée commence par une interro de rappel de 15 min (10 questions, notée sur 20) sur les chapitres vus la veille, à J-3, J-7 et J-14. Clique sur un bloc pour voir les notions et les fichiers du Drive. Pour changer l\'ordre, glisse un bloc sur un autre créneau (ou ouvre-le et choisis « Déplacer ») : les rappels se recalculent tout seuls.</p></div><div class="spacer"></div>' + chips + "</div>" +
      (moving ? '<div class="movebar"><span>Choisis le nouveau créneau pour <b>' + esc(slotInfo(findSlot(moving).slot).title) + '</b> : clique sur un bloc pour l\'échanger ou sur une case libre. Tu peux changer de semaine.</span><button class="btn" data-cancel-move>Annuler</button></div>' : "") + grid + mob +
      '<div class="legend">' + ["sv:Sciences de la vie", "adcp:Condition physique", "psy:Psychologie", "soc:Sociologie", "apsa:APSA", "min:Mineure santé", "rev:Annales et révisions"].map(x => { const [c, n] = x.split(":"); return '<span class="s-' + c + '"><span class="tag">' + n + "</span></span>"; }).join("") +
      '<span class="spacer"></span>' + (state.layout && Object.keys(state.layout).length ? '<button class="btn" data-reset-layout>' + (resetArmed ? "Clique encore pour confirmer" : "Rétablir le planning d\'origine") + "</button>" : "") + '<label class="setting" for="startInput">Début du planning <input type="date" id="startInput" value="' + iso(startDate()) + '"></label></div>';
  }

  function renderToday() {
    const el = document.getElementById("v-aujourdhui");
    const g = curDay; const day = DAYS[g]; const date = dateOf(g);
    const now = new Date(); const isToday = g === ti;
    const hm = now.getHours() * 60 + now.getMinutes();
    const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
    let intro = "";
    if (ti < 0 && now < dateOf(0)) intro = "Le planning commence le lundi " + fmt(dateOf(0)) + " Voici ta première journée.";
    else if (ti < 0 && now > dateOf(19)) intro = "Le planning est terminé. Voici la dernière journée.";
    else if (ti < 0) intro = "Aujourd'hui est un jour de week-end : repos. Voici la prochaine journée de travail.";
    let tl = '<div class="timeline">';
    if (!day.full) tl += '<div class="tl-row"><span class="time">08:00-12:00</span><div class="off" style="min-height:60px">Matin libre</div></div>';
    day.slots.forEach(s => {
      const live = isToday && hm >= toMin(s.time[0]) && hm < toMin(s.time[1]);
      tl += '<div class="tl-row' + (live ? " now" : "") + '"><span class="time">' + s.time[0] + "-" + s.time[1] + '</span><div style="display:grid">' + slotButton(s) + "</div></div>";
      if (s.lbl === "B") tl += '<div class="tl-row"><span class="time">12:00-14:00</span><div class="lunch" style="text-align:left">Pause déjeuner</div></div>';
    });
    tl += "</div>";
    const rappels = day.slots.filter(s => s.kind === "rappel");
    const allIds = [...new Set(rappels.flatMap(r => r.list.map(x => x.id)))];
    let side = '<div class="panel"><span class="sect-lbl">Piqûres de rappel du jour</span>';
    if (allIds.length) {
      side += "<h3>" + allIds.length + " chapitre" + (allIds.length > 1 ? "s" : "") + " à réactiver</h3><ul style=\"margin:0;padding-left:18px\">" + rappels.flatMap(r => r.list.map(x => "<li>" + esc(CH[x.id].title) + ' <span class="mini">(' + esc(x.label) + ")</span></li>")).join("") + "</ul>";
      side += '<div class="acts" style="display:flex;gap:8px;flex-wrap:wrap">' + rappels.filter(r => r.list.length).map(r => '<button class="btn primary" data-quiz-slot="' + r.key + '">Rappel ' + (r.lbl === "R1" ? "du matin" : "de l'après-midi") + "</button>").join("") + "</div>";
    } else side += "<h3>Premier jour</h3><p>Pas encore de chapitre à revoir. Les rappels démarrent dès demain matin.</p>";
    side += "</div>";
    const doneToday = day.slots.filter(s => s.kind === "study" && state.done[s.key]).length;
    const totToday = day.slots.filter(s => s.kind === "study").length;
    side += '<div class="panel"><span class="sect-lbl">Progression du jour</span><div class="stat-row"><div><b>' + doneToday + "/" + totToday + "</b><span>blocs faits</span></div><div><b>" + (function () { const m = totToday * 105 + day.slots.filter(x => x.kind === "rappel").length * 15; return Math.floor(m / 60) + " h" + (m % 60 ? String(m % 60).padStart(2, "0") : ""); })() + "</b><span>de travail prévues</span></div></div><p>Coche un bloc en l'ouvrant, une fois le chapitre travaillé.</p></div>";
    el.innerHTML = '<div class="view-head"><div><h2>' + DAY_NAMES[day.d] + " " + fmt(date) + '</h2><p>' + (intro || "Semaine " + (day.w + 1) + ", jour " + (day.d + 1) + ".") + '</p></div><div class="spacer"></div><div class="daynav"><button class="btn" data-day="' + (g - 1) + '"' + (g === 0 ? " disabled" : "") + '>← Jour précédent</button><button class="btn" data-day="' + (g + 1) + '"' + (g === 19 ? " disabled" : "") + ">Jour suivant →</button></div></div>" +
      '<div class="today-grid"><div>' + tl + "</div><div style=\"display:flex;flex-direction:column;gap:14px\">" + side + "</div></div>";
  }

  function cardStats(ids) {
    const counts = [0, 0, 0, 0]; let total = 0;
    ids.forEach(id => CH[id].cards.forEach((_, i) => { total++; const b = state.boxes[cardId(id, i)]; counts[b === undefined ? 0 : Math.min(3, b + (b >= 0 ? 0 : 0))]++; }));
    return { counts, total };
  }
  function boxBar(ids) {
    const { counts, total } = cardStats(ids);
    // counts[0] = jamais vue/à revoir, 1..3 = niveaux
    const seenBad = ids.reduce((n, id) => n + CH[id].cards.filter((_, i) => state.boxes[cardId(id, i)] === 0).length, 0);
    const unseen = counts[0] - seenBad;
    const segs = [[seenBad, BOX_COLORS[0]], [counts[1], BOX_COLORS[1]], [counts[2], BOX_COLORS[2]], [counts[3], BOX_COLORS[3]]];
    return '<div class="boxes" title="' + unseen + ' jamais vue(s)">' + segs.map(([n, c]) => n ? '<i style="width:' + (100 * n / total) + "%;background:" + c + '"></i>' : "").join("") + "</div>";
  }

  function renderChapters() {
    const el = document.getElementById("v-chapitres");
    const groups = {};
    CHAPTERS.forEach(c => { const ue = SUBJECTS[c.subj].ue; (groups[ue] = groups[ue] || []).push(c); });
    let html = '<div class="view-head"><div><h2>Tout le contenu du dossier Drive 2025-2026</h2><p>' + CHAPTERS.length + " chapitres répartis sur 4 semaines (l'anglais et l'anatomie sont exclus ; la mineure santé est incluse). Chaque carte indique quand le chapitre est prévu, les fichiers à ouvrir et ton niveau sur les cartes de rappel.</p></div></div>";
    Object.keys(groups).forEach(ue => {
      const list = groups[ue];
      const parts = list.reduce((n, c) => n + c.parts, 0);
      const done = list.reduce((n, c) => n + (sessionsOf[c.id] || []).filter(s => state.done[s.key]).length, 0);
      html += '<div class="ue"><h3>' + esc(ue) + "<small>" + done + "/" + parts + ' séances faites</small></h3><div class="chgrid">';
      list.forEach(c => {
        const ses = sessionsOf[c.id] || [];
        const when = ses.map(s => DAY_NAMES[DAYS[s.g].d].slice(0, 3) + ". " + fmt(dateOf(s.g))).join(", ");
        html += '<div class="ch s-' + SUBJECTS[c.subj].color + '"><div class="row"><span class="tag">' + esc(SUBJECTS[c.subj].name) + '</span><span class="pips">' + ses.map(s => '<i class="' + (state.done[s.key] ? "on" : "") + '"></i>').join("") + "</span></div>" +
          "<h4>" + esc(c.title) + '</h4><div class="when">Prévu : ' + esc(when) + "</div>" + boxBar([c.id]) +
          '<div class="mini">' + c.cards.length + ' cartes de rappel</div><div class="links">' + c.files.map(f => '<a href="' + f[1] + '" target="_blank" rel="noopener">' + esc(f[0]) + "</a>").join("") + "</div>" +
          '<div class="row"><button class="btn" data-open-ch="' + c.id + '">Notions clés</button><button class="btn" data-quiz-ch="' + c.id + '">S\'entraîner</button></div></div>';
      });
      html += "</div></div>";
    });
    el.innerHTML = html;
  }

  let rappelFilter = "all";
  function renderRappels() {
    const el = document.getElementById("v-rappels");
    const totalCards = CHAPTERS.reduce((n, c) => n + c.cards.length, 0);
    const mastered = Object.values(state.boxes).filter(b => b >= 3).length;
    const toReview = Object.values(state.boxes).filter(b => b === 0).length;
    const grades = state.grades || [];
    const avg = grades.length ? grades.reduce((s, g) => s + g.s, 0) / grades.length : null;
    const dueN = dueCards().length;
    let html = '<div class="view-head"><div><h2>Interros et piqûres de rappel</h2><p>' + totalCards + ' questions tirées de tes cours : QCM, vrai ou faux et questions ouvertes. Chaque interro est notée sur 20 et chronométrée. Les questions ratées reviennent en priorité, et les questions déjà vues récemment passent après les autres.</p></div></div>';
    html += '<div class="panel smart"><div class="stat-row"><div><b>' + (avg === null ? "–" : fmtNote(avg)) + "</b><span>moyenne /20 (" + grades.length + " interros)</span></div><div><b>" + toReview + "</b><span>questions à revoir</span></div><div><b>" + mastered + "</b><span>maîtrisées</span></div></div>" +
      '<div class="acts" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-interro="10">Interro sur 10 questions</button><button class="btn primary" data-interro="20">Interro sur 20 questions</button><button class="btn" data-quiz-smart="1"' + (dueN ? "" : " disabled") + ">Questions à revoir</button></div></div>";
    if (grades.length) {
      html += '<div class="panel" style="margin-bottom:18px"><span class="sect-lbl">Dernières notes</span><div class="grades">' + grades.slice(-8).reverse().map(g => { const d = new Date(g.d); return '<div class="grade ' + (g.s >= 10 ? "ok" : "ko") + '"><b>' + fmtNote(g.s) + "</b><span>/20 · " + d.getDate() + " " + MONTHS[d.getMonth()] + "</span><small>" + esc(g.t) + "</small></div>"; }).join("") + "</div></div>";
    }
    const subs = [["all", "Tout"], ["sv", "Sciences de la vie"], ["adcp", "Condition physique"], ["psy", "Psychologie"], ["soc", "Sociologie"], ["apsa", "APSA"], ["min", "Mineure santé"]];
    html += '<p class="mini" style="margin:0 0 8px">Le filtre choisit aussi la matière des interros sur 10 ou 20 (chapitres déjà vus en priorité).</p><div class="chips" style="margin-bottom:12px" role="group" aria-label="Filtrer par matière">' + subs.map(([k, n]) => '<button class="chip" data-rfilter="' + k + '" aria-pressed="' + (rappelFilter === k) + '">' + n + "</button>").join("") + "</div>";
    html += '<div class="deck-grid">';
    CHAPTERS.filter(c => rappelFilter === "all" || SUBJECTS[c.subj].color === rappelFilter).forEach(c => {
      const st = c.cards.filter((_, i) => (state.boxes[cardId(c.id, i)] ?? -1) >= 3).length;
      html += '<button class="deck s-' + SUBJECTS[c.subj].color + '" data-quiz-ch="' + c.id + '"><span class="tag">' + esc(SUBJECTS[c.subj].name) + "</span><b>" + esc(c.title) + "</b>" + boxBar([c.id]) + '<span class="mini">' + c.cards.length + " questions · " + st + " maîtrisées</span></button>";
    });
    html += "</div>";
    el.innerHTML = html;
  }

  /* ---------- quiz ---------- */
  function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function norm(card) {
    if (Array.isArray(card)) return { t: "open", q: card[0], a: card[1] };
    return card;
  }
  function correctText(c) {
    if (c.t === "qcm") return c.o[c.a];
    if (c.t === "vf") return c.v ? "Vrai" : "Faux";
    return c.a;
  }
  // Priorité : cartes ratées, puis jamais vues, puis les moins récemment vues. Tirage aléatoire à chaque fois.
  function pickCards(ids, max) {
    const pool = []; ids.forEach(id => CH[id].cards.forEach((_, i) => pool.push([id, i])));
    const prio = ([id, i]) => {
      const k = cardId(id, i); const b = state.boxes[k]; const seen = (state.seen || {})[k] || 0;
      const base = b === 0 ? 0 : (b === undefined ? 1 : 2 + b);
      return base + Math.random() * 1.5 + (seen && Date.now() - seen < 2 * 864e5 ? 1.2 : 0);
    };
    const sorted = pool.map(c => [c, prio(c)]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
    const per = Math.max(2, Math.ceil(max / ids.length) + 1);
    const count = {}; const out = [];
    for (const c of sorted) { if (out.length >= max) break; count[c[0]] = (count[c[0]] || 0) + 1; if (count[c[0]] <= per) out.push(c); }
    for (const c of sorted) { if (out.length >= max) break; if (!out.includes(c)) out.push(c); }
    return shuffle(out);
  }
  function studiedIds() {
    const t = todayIndex(); const now = new Date();
    const lim = t >= 0 ? t : (now > dateOf(19) ? 99 : -1);
    return Object.keys(completion).filter(id => Math.floor(completion[id]) <= lim || (sessionsOf[id] || []).some(s => state.done[s.key]));
  }
  function dueCards() {
    const ids = studiedIds();
    const out = [];
    CHAPTERS.forEach(c => c.cards.forEach((_, i) => { const b = state.boxes[cardId(c.id, i)]; if (b === 0 || (ids.includes(c.id) && (b === undefined || b < 3))) out.push([c.id, i]); }));
    return out;
  }

  let quiz = null; let timer = null;
  const dlg = document.getElementById("dlg"); const body = document.getElementById("dlgBody");
  function openDlg(html) { body.innerHTML = html; if (!dlg.open) { try { dlg.showModal(); } catch (e) { dlg.setAttribute("open", ""); } } }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
  function closeDlg() { quiz = null; stopTimer(); try { dlg.close(); } catch (e) { dlg.removeAttribute("open"); } }
  dlg.addEventListener("close", () => { quiz = null; stopTimer(); renderAll(); });
  dlg.addEventListener("click", e => { if (e.target === dlg) closeDlg(); });

  function fmtNote(x) { const r = Math.round(x * 2) / 2; return String(r).replace(".", ","); }
  function quizScore() { return quiz.pts.reduce((s, p) => s + p, 0) * 20 / quiz.items.length; }
  function tickTimer() {
    const el = document.getElementById("qtimer"); if (!quiz || !el) return;
    const left = Math.round((quiz.deadline - Date.now()) / 1000);
    if (left <= 0) { el.textContent = "Temps écoulé"; el.classList.add("late"); return; }
    el.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  }
  function startQuiz(items, title, opts) {
    opts = opts || {};
    if (!items.length) return;
    const minutes = opts.minutes || Math.max(5, Math.round(items.length * 1.5));
    quiz = { items, i: 0, step: "ask", pts: [], wrong: [], title, slotKey: opts.slotKey || null, deadline: Date.now() + minutes * 60000, minutes, order: null, picked: null };
    stopTimer(); timer = setInterval(tickTimer, 1000);
    drawQuiz();
  }
  function head() {
    return '<div class="dlg-head"><h3>' + esc(quiz.title) + '</h3><button class="x" data-close aria-label="Fermer">×</button></div>';
  }
  function appreciation(n) {
    if (n >= 18) return "Excellent, c'est maîtrisé.";
    if (n >= 15) return "Très bien. Quelques détails à reprendre.";
    if (n >= 12) return "Bien. Revois les questions ratées ci-dessous.";
    if (n >= 10) return "Juste la moyenne. Relis les fiches de ces chapitres.";
    return "À retravailler : reprends les cours concernés avant le prochain rappel.";
  }
  function drawQuiz() {
    const q = quiz;
    if (q.i >= q.items.length) {
      stopTimer();
      const note = quizScore();
      if (!q.saved) {
        q.saved = true;
        state.grades = state.grades || [];
        state.grades.push({ d: new Date().toISOString(), t: q.title, s: Math.round(note * 2) / 2, n: q.items.length });
        if (state.grades.length > 200) state.grades = state.grades.slice(-200);
        if (q.slotKey) state.done[q.slotKey] = true;
        save();
      }
      let rec = "";
      if (q.wrong.length) rec = '<div><div class="sect-lbl">Corrections à retenir</div><ul class="recap">' + q.wrong.map(w => "<li><b>" + esc(w.q) + "</b><br>" + esc(w.a) + "</li>").join("") + "</ul></div>";
      openDlg(head() + '<div class="summary"><b>' + fmtNote(note) + '</b><span class="over">/20</span></div><p>' + appreciation(note) + " " + (q.items.length - q.wrong.length) + " réponse(s) juste(s) sur " + q.items.length + ".</p>" + rec + '<div class="acts"><button class="btn primary" data-close>Terminer</button></div>');
      return;
    }
    const [id, idx] = q.items[q.i]; const c = CH[id]; const card = norm(c.cards[idx]);
    const per = 20 / q.items.length;
    let html = head() + '<div class="qprog"><span>Question ' + (q.i + 1) + "/" + q.items.length + " · " + fmtNote(per) + ' pt</span><span class="timer" id="qtimer"></span><span>Note : ' + fmtNote(quizScore()) + "/20</span></div>" +
      '<div class="qchap s-' + SUBJECTS[c.subj].color + '"><span class="tag">' + esc(SUBJECTS[c.subj].name) + "</span> " + esc(c.title) + ' <span class="kind">' + (card.t === "qcm" ? "QCM" : card.t === "vf" ? "Vrai ou faux" : "Question ouverte") + "</span></div>" +
      '<div class="card s-' + SUBJECTS[c.subj].color + '"><div class="q">' + esc(card.q) + "</div>";
    if (card.t === "qcm") {
      if (!q.order) q.order = shuffle(card.o.map((_, k) => k));
      html += '<div class="opts">' + q.order.map((k, n) => {
        let cls = "opt";
        if (q.step === "fb") { if (k === card.a) cls += " ok"; else if (k === q.picked) cls += " ko"; }
        return '<button class="' + cls + '" data-opt="' + k + '"' + (q.step === "fb" ? " disabled" : "") + "><span>" + (n + 1) + "</span>" + esc(card.o[k]) + "</button>";
      }).join("") + "</div>";
    } else if (card.t === "vf") {
      html += '<div class="opts two">' + [[1, "Vrai"], [0, "Faux"]].map(([v, lbl], n) => {
        let cls = "opt";
        if (q.step === "fb") { if (!!v === card.v) cls += " ok"; else if (v === q.picked) cls += " ko"; }
        return '<button class="' + cls + '" data-opt="' + v + '"' + (q.step === "fb" ? " disabled" : "") + "><span>" + (n + 1) + "</span>" + lbl + "</button>";
      }).join("") + "</div>";
    } else if (q.step !== "ask") {
      html += '<div class="a">' + esc(card.a) + "</div>";
    }
    if (q.step === "fb" && card.t !== "open") {
      const ok = q.pts[q.i] > 0;
      html += '<div class="fb ' + (ok ? "good" : "bad") + '"><b>' + (ok ? "Juste." : "Faux.") + "</b> " + (ok ? "" : "Réponse : " + esc(correctText(card)) + ". ") + esc(card.e || "") + "</div>";
    }
    html += "</div><div class=\"acts\">";
    if (card.t === "open") {
      if (q.step === "ask") html += '<button class="btn primary" data-flip>Voir la réponse (espace)</button>';
      else if (q.step === "reveal") html += '<span class="mini" style="align-self:center">Note-toi honnêtement :</span><button class="btn good" data-self="1">Juste (1)</button><button class="btn" data-self="0.5">À moitié (2)</button><button class="btn warn" data-self="0">Faux (3)</button>';
    } else if (q.step === "fb") html += '<button class="btn primary" data-next>' + (q.i + 1 < q.items.length ? "Question suivante (entrée)" : "Voir ma note (entrée)") + "</button>";
    html += "</div>";
    openDlg(html); tickTimer();
  }
  function record(points) {
    const [id, idx] = quiz.items[quiz.i]; const k = cardId(id, idx);
    const b = state.boxes[k];
    if (points >= 1) state.boxes[k] = Math.min(3, (b === undefined ? 0 : b) + 1);
    else if (points === 0) state.boxes[k] = 0;
    else if (b === undefined) state.boxes[k] = 0;
    state.seen = state.seen || {}; state.seen[k] = Date.now();
    quiz.pts[quiz.i] = points;
    if (points < 1) { const card = norm(CH[id].cards[idx]); quiz.wrong.push({ q: card.q, a: correctText(card) + (card.e ? " (" + card.e + ")" : "") }); }
    save();
  }
  function next() { quiz.i++; quiz.step = "ask"; quiz.order = null; quiz.picked = null; drawQuiz(); }
  function choose(v) {
    const [id, idx] = quiz.items[quiz.i]; const card = norm(CH[id].cards[idx]);
    const ok = card.t === "qcm" ? v === card.a : (!!v === card.v);
    quiz.picked = v; record(ok ? 1 : 0); quiz.step = "fb"; drawQuiz();
  }
  document.addEventListener("keydown", e => {
    if (!quiz || !dlg.open || quiz.i >= quiz.items.length) return;
    const [id, idx] = quiz.items[quiz.i]; const card = norm(CH[id].cards[idx]);
    const n = Number(e.key);
    if (card.t === "open") {
      if (e.key === " " && quiz.step === "ask") { e.preventDefault(); quiz.step = "reveal"; drawQuiz(); }
      else if (quiz.step === "reveal" && n >= 1 && n <= 3) { e.preventDefault(); record([1, 0.5, 0][n - 1]); next(); }
    } else if (quiz.step === "ask" && n >= 1) {
      if (card.t === "qcm" && quiz.order && n <= quiz.order.length) { e.preventDefault(); choose(quiz.order[n - 1]); }
      if (card.t === "vf" && n <= 2) { e.preventDefault(); choose(n === 1 ? 1 : 0); }
    } else if (quiz.step === "fb" && e.key === "Enter") { e.preventDefault(); next(); }
  });

  function rappelQuiz(slotKey) {
    const f = findSlot(slotKey); if (!f) return;
    const ids = f.slot.list.map(x => x.id);
    if (!ids.length) { openDlg('<div class="dlg-head"><h3>Piqûre de rappel</h3><button class="x" data-close aria-label="Fermer">×</button></div><p>Rien à revoir pour l\'instant : c\'est le tout début. Profite de ces 15 minutes pour ouvrir le dossier Drive et préparer tes fiches.</p><div class="acts"><button class="btn" data-mark="' + slotKey + '">Marquer comme fait</button></div>'); return; }
    let items = pickCards(ids, 10);
    if (items.length < 10) {
      const others = studiedIds().filter(id => !ids.includes(id));
      if (others.length) items = items.concat(pickCards(others, 10 - items.length));
    }
    startQuiz(items, "Interro de rappel · " + DAY_NAMES[f.day.d] + " " + fmt(dateOf(f.day.g)), { slotKey, minutes: 15 });
  }

  function openSlot(key) {
    const f = findSlot(key); if (!f) return;
    const s = f.slot;
    if (s.kind === "rappel") {
      const lst = s.list.length ? "<ul>" + s.list.map(x => "<li>" + esc(CH[x.id].title) + ' <span class="mini">(' + esc(x.label) + ")</span></li>").join("") + "</ul>" : "<p>Pas encore de chapitre à revoir.</p>";
      openDlg('<div class="dlg-head"><h3>Piqûre de rappel · ' + s.time[0] + '</h3><button class="x" data-close aria-label="Fermer">×</button></div><p class="mini">' + DAY_NAMES[f.day.d] + " " + fmt(dateOf(f.day.g)) + ' · 15 minutes</p><div><div class="sect-lbl">Chapitres réactivés</div>' + lst + '</div><div class="acts">' + (s.list.length ? '<button class="btn primary" data-quiz-slot="' + key + '">Lancer l\'interro (10 questions, /20)</button>' : "") + '<button class="btn" data-mark="' + key + '">' + (state.done[key] ? "Marquer comme non fait" : "Marquer comme fait") + "</button></div>");
      return;
    }
    const info = slotInfo(s);
    let html = '<div class="dlg-head"><h3>' + esc(info.title) + '</h3><button class="x" data-close aria-label="Fermer">×</button></div><p class="mini">' + DAY_NAMES[f.day.d] + " " + fmt(dateOf(f.day.g)) + " · " + s.time[0] + "-" + s.time[1] + "</p>";
    const quizIds = [];
    s.items.forEach(it => {
      if (it.review) {
        const r = REVIEWS[it.review];
        html += '<div class="s-rev"><span class="tag">' + (r.type === "annale" ? "Annale" : r.type === "bilan" ? "Bilan" : "Révision") + '</span></div><div><div class="sect-lbl">Au programme</div><ul>' + r.notions.map(n => "<li>" + esc(n) + "</li>").join("") + "</ul></div>";
        if (r.files) html += '<div><div class="sect-lbl">Fichiers</div><div class="links">' + r.files.map(x => '<a href="' + x[1] + '" target="_blank" rel="noopener">' + esc(x[0]) + "</a>").join("") + "</div></div>";
        const ids = r.chapters === "all" ? CHAPTERS.map(c => c.id) : r.chapters;
        quizIds.push(...ids);
        html += '<p class="mini">Chapitres couverts : ' + ids.map(id => esc(CH[id].title)).join(", ") + ".</p>";
      } else {
        const c = CH[it.ch];
        const partNote = c.parts > 1 ? (it.part === 1 ? "Partie " + it.part + "/" + c.parts + " : commence le cours et fais la fiche du début." : (it.part === c.parts ? "Partie " + it.part + "/" + c.parts + " : termine le cours, complète la fiche et fais les cartes de rappel." : "Partie " + it.part + "/" + c.parts + " : continue le cours.")) : "Lis le cours, fais ta fiche, puis teste-toi avec les cartes.";
        html += '<div class="s-' + SUBJECTS[c.subj].color + '"><span class="tag">' + esc(SUBJECTS[c.subj].name) + "</span> <b>" + esc(c.title) + '</b></div><p class="mini">' + partNote + '</p><div><div class="sect-lbl">Notions clés</div><ul>' + c.notions.map(n => "<li>" + esc(n) + "</li>").join("") + '</ul></div><div><div class="sect-lbl">Fichiers du Drive</div><div class="links">' + c.files.map(x => '<a href="' + x[1] + '" target="_blank" rel="noopener">' + esc(x[0]) + "</a>").join("") + "</div></div>";
        quizIds.push(c.id);
      }
    });
    html += '<div class="acts"><button class="btn primary" data-mark="' + key + '">' + (state.done[key] ? "Marquer comme non fait" : "Marquer comme fait") + '</button><button class="btn" data-quiz-ids="' + quizIds.join(",") + '">Interro notée /20</button><button class="btn" data-start-move="' + key + '">Déplacer ce bloc</button></div>';
    openDlg(html);
  }

  function openChapter(id) {
    const c = CH[id];
    openDlg('<div class="dlg-head"><h3>' + esc(c.title) + '</h3><button class="x" data-close aria-label="Fermer">×</button></div><div class="s-' + SUBJECTS[c.subj].color + '"><span class="tag">' + esc(SUBJECTS[c.subj].name) + '</span></div><div><div class="sect-lbl">Notions clés</div><ul>' + c.notions.map(n => "<li>" + esc(n) + "</li>").join("") + '</ul></div><div><div class="sect-lbl">Fichiers du Drive</div><div class="links">' + c.files.map(x => '<a href="' + x[1] + '" target="_blank" rel="noopener">' + esc(x[0]) + "</a>").join("") + '</div></div><div class="acts"><button class="btn primary" data-quiz-ch="' + id + '">S\'entraîner (' + c.cards.length + " cartes)</button></div>");
  }

  /* ---------- events ---------- */
  document.addEventListener("click", e => {
    const t = e.target.closest("button, [data-close], [data-pos]"); if (!t) return;
    if (t.hasAttribute("data-close")) { closeDlg(); return; }
    if (t.dataset.startMove) { moving = t.dataset.startMove; closeDlg(); const p = parsePos(moving); curWeek = p.w; if (location.hash !== "#semaine") location.hash = "semaine"; else renderAll(); return; }
    if (t.hasAttribute("data-cancel-move")) { moving = null; renderAll(); return; }
    if (t.hasAttribute("data-reset-layout")) { if (!resetArmed) { resetArmed = true; renderAll(); return; } resetArmed = false; state.layout = {}; save(); buildPlan(); renderAll(); return; }
    if (moving && t.dataset.pos) { const from = moving; moving = null; moveSlot(from, t.dataset.pos); renderAll(); return; }
    if (t.dataset.flip !== undefined) { quiz.step = "reveal"; drawQuiz(); return; }
    if (t.dataset.opt !== undefined) { if (quiz.step === "ask") choose(Number(t.dataset.opt)); return; }
    if (t.dataset.self !== undefined) { record(Number(t.dataset.self)); next(); return; }
    if (t.dataset.next !== undefined) { next(); return; }
    if (t.dataset.interro) { const n = Number(t.dataset.interro); const inF = CHAPTERS.filter(c => rappelFilter === "all" || SUBJECTS[c.subj].color === rappelFilter).map(c => c.id); const st = studiedIds().filter(id => inF.includes(id)); const ids = st.length >= 2 ? st : inF; startQuiz(pickCards(ids, n), "Interro sur " + n + " · " + (rappelFilter === "all" ? "toutes matières" : ({ sv: "Sciences de la vie", adcp: "Condition physique", psy: "Psychologie", soc: "Sociologie", apsa: "APSA", min: "Mineure santé" })[rappelFilter]), { minutes: n === 20 ? 25 : 15 }); return; }
    if (t.dataset.mark) { state.done[t.dataset.mark] = !state.done[t.dataset.mark]; save(); closeDlg(); return; }
    if (t.dataset.quizSlot) { rappelQuiz(t.dataset.quizSlot); return; }
    if (t.dataset.quizCh) { const c = CH[t.dataset.quizCh]; const n = Math.min(10, c.cards.length); startQuiz(pickCards([c.id], n), "Interro · " + c.title, { minutes: 15 }); return; }
    if (t.dataset.quizIds) { const ids = [...new Set(t.dataset.quizIds.split(","))]; const n = ids.length >= 5 ? 20 : 10; startQuiz(pickCards(ids, n), "Interro sur " + n, { minutes: n === 20 ? 25 : 15 }); return; }
    if (t.dataset.quizSmart) { const d = shuffle(dueCards()).sort((a, b) => (state.boxes[cardId(a[0], a[1])] === 0 ? 0 : 1) - (state.boxes[cardId(b[0], b[1])] === 0 ? 0 : 1)); startQuiz(shuffle(d.slice(0, 10)), "Questions à revoir", { minutes: 15 }); return; }
    if (t.dataset.openCh) { openChapter(t.dataset.openCh); return; }
    if (t.dataset.week !== undefined) { curWeek = Number(t.dataset.week); renderWeek(); return; }
    if (t.dataset.day !== undefined) { curDay = Math.max(0, Math.min(19, Number(t.dataset.day))); renderToday(); return; }
    if (t.dataset.rfilter) { rappelFilter = t.dataset.rfilter; renderRappels(); return; }
    if (t.dataset.key) { openSlot(t.dataset.key); return; }
  });
  /* glisser-déposer (ordinateur) */
  let dragFrom = null;
  document.addEventListener("dragstart", e => {
    const el = e.target.closest && e.target.closest(".slot.study[draggable]"); if (!el) return;
    dragFrom = el.dataset.key; el.classList.add("dragging");
    try { e.dataTransfer.setData("text/plain", dragFrom); e.dataTransfer.effectAllowed = "move"; } catch (err) {}
  });
  document.addEventListener("dragend", () => { dragFrom = null; document.querySelectorAll(".dragging, .over").forEach(n => n.classList.remove("dragging", "over")); });
  document.addEventListener("dragover", e => {
    if (!dragFrom) return;
    const el = e.target.closest && e.target.closest("[data-pos]"); if (!el) return;
    e.preventDefault(); try { e.dataTransfer.dropEffect = "move"; } catch (err) {}
    document.querySelectorAll(".over").forEach(n => { if (n !== el) n.classList.remove("over"); });
    el.classList.add("over");
  });
  document.addEventListener("drop", e => {
    const el = e.target.closest && e.target.closest("[data-pos]"); if (!el || !dragFrom) return;
    e.preventDefault();
    const from = dragFrom; dragFrom = null; moving = null;
    moveSlot(from, el.dataset.pos); renderAll();
  });

  document.addEventListener("change", e => {
    if (e.target.id === "startInput" && e.target.value) { state.start = iso(snapMonday(parseDate(e.target.value))); save(); locateToday(); renderAll(); }
  });

  /* ---------- routing ---------- */
  const VIEWS = ["aujourdhui", "semaine", "chapitres", "rappels"];
  function currentView() { const h = location.hash.replace("#", ""); return VIEWS.includes(h) ? h : "aujourdhui"; }
  function renderAll() {
    ti = todayIndex(); rangeText(); updateMeter();
    const v = currentView();
    VIEWS.forEach(x => { document.getElementById("v-" + x).hidden = x !== v; });
    document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.view === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (v === "semaine") renderWeek(); else if (v === "aujourdhui") renderToday(); else if (v === "chapitres") renderChapters(); else renderRappels();
  }
  window.addEventListener("hashchange", renderAll);
  renderAll();
})();
</script>

</body>
</html>
