<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>Planning S1 LAS 2 STAPS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a coach's whiteboard week. Day columns on cool court paper, subjects worn as coloured jersey tags. */
:root {
  --bg: #f2f5f7; --surface: #ffffff; --ink: #14212b; --muted: #586874; --line: #d3dce3; --accent: #1f5bd6;
  --sv: #c2384f; --adcp: #b86f0e; --psy: #6d4fc4; --soc: #11806f; --apsa: #4a8420; --rev: #46545f; --min: #a1307b; --pha: #0a7ca3; --si: #3346a8;
  --k1: #1f63c9; --k2: #0d8576; --k3: #b8650b; --k4: #7447c9; --k5: #c0336a; --k6: #3b7f22;
  --good: #1d7a45; --warn: #b5520e;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e161c; --surface: #16212a; --ink: #e6edf2; --muted: #95a6b3; --line: #2a3843; --accent: #7ba3ff;
  --sv: #f07086; --adcp: #f0a646; --psy: #a88ff5; --soc: #43c3b3; --apsa: #8bc75a; --rev: #a2afba; --min: #e98bcb; --pha: #52c2e6; --si: #9aa8ff;
  --k1: #6fa6ff; --k2: #46cbb7; --k3: #f2a54a; --k4: #b195ff; --k5: #f77fae; --k6: #8fd067;
  --good: #5fd08e; --warn: #f39a5b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e161c; --surface: #16212a; --ink: #e6edf2; --muted: #95a6b3; --line: #2a3843; --accent: #7ba3ff;
  --sv: #f07086; --adcp: #f0a646; --psy: #a88ff5; --soc: #43c3b3; --apsa: #8bc75a; --rev: #a2afba; --min: #e98bcb; --pha: #52c2e6; --si: #9aa8ff;
  --k1: #6fa6ff; --k2: #46cbb7; --k3: #f2a54a; --k4: #b195ff; --k5: #f77fae; --k6: #8fd067;
  --good: #5fd08e; --warn: #f39a5b; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.s-sv { --c: var(--sv); } .s-adcp { --c: var(--adcp); } .s-psy { --c: var(--psy); } .s-soc { --c: var(--soc); } .s-apsa { --c: var(--apsa); } .s-rev { --c: var(--rev); } .s-min { --c: var(--min); } .s-pha { --c: var(--pha); } .s-si { --c: var(--si); }
.fiche { display: flex; flex-direction: column; gap: 12px; border-left: 3px solid var(--pha); padding: 2px 0 2px 14px; }
.fiche h4 { margin: 0 0 4px; font-family: var(--f-display); font-size: 19px; letter-spacing: .01em; }
.fiche ul { gap: 5px; }
.fiche-src { font-size: 13px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; margin: 0; }
details.fold > summary { cursor: pointer; font-weight: 700; color: var(--accent); padding: 4px 0; }
details.fold[open] > summary { margin-bottom: 10px; }
/* ---------- Lecteur de cours plein écran ---------- */
body.reading { overflow: hidden; }
.reader { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.reader[hidden] { display: none; }
.rd-bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, 3vw) 10px; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 2px 10px rgba(10, 20, 30, .06); }
.rd-bar .rd-crumb { flex: 1; min-width: 140px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rd-bar .rd-crumb small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.rd-bar .btn.on { background: var(--good); border-color: var(--good); color: #fff; }
.rd-hero { padding: clamp(24px, 4vw, 52px) max(16px, 5vw) clamp(20px, 3vw, 36px); background: linear-gradient(135deg, color-mix(in srgb, var(--c) 26%, var(--surface)) 0%, color-mix(in srgb, var(--c) 8%, var(--bg)) 55%, var(--bg) 100%); border-bottom: 1px solid var(--line); }
.rd-hero-in { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.rd-hero h1 { font-size: clamp(32px, 4.6vw, 62px); line-height: 1.02; max-width: 26ch; }
.rd-hook { font-size: clamp(17px, 1.5vw, 21px); line-height: 1.5; max-width: 72ch; margin: 0; }
.rd-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.rd-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
.rd-pill.main { background: var(--c); border-color: var(--c); color: #fff; }
.rd-src { font-size: 13.5px; color: var(--muted); max-width: 90ch; margin: 0; }
.rd-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.rd-tabs button { border: 2px solid var(--c); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
.rd-tabs button[aria-pressed="true"] { background: var(--c); color: #fff; }
.rd-body { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: clamp(20px, 3vw, 40px); padding: 28px max(16px, 5vw) 72px; max-width: 1500px; margin: 0 auto; }
.rd-toc { position: sticky; top: 84px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
.rd-toc .sect-lbl { padding: 0 10px 6px; }
.rd-toc button { display: flex; gap: 10px; align-items: center; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; cursor: pointer; color: var(--ink); font-size: 14.5px; line-height: 1.25; }
.rd-toc button:hover { background: var(--surface); }
.rd-toc .n, .rd-sec h2 .n { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--k); color: #fff; font: 700 13px var(--f-mono); }
.rd-main { min-width: 0; font-size: 17px; line-height: 1.55; }
.rd-sec { --k: var(--k1); background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--k); border-radius: 16px; padding: clamp(18px, 2.4vw, 32px); margin-bottom: 24px; scroll-margin-top: 84px; display: flex; flex-direction: column; gap: 14px; }
.rd-sec h2 { display: flex; align-items: center; gap: 12px; font-size: clamp(24px, 2.5vw, 34px); color: var(--k); }
.rd-sec h2 .n { width: 34px; height: 34px; font-size: 15px; }
.rd-main p { margin: 0; max-width: 85ch; }
.rd-ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.rd-tabwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
.rd-tab { border-collapse: collapse; width: 100%; font-size: 16px; }
.rd-tab th { text-align: left; padding: 10px 14px; background: color-mix(in srgb, var(--k) 18%, var(--surface)); font-family: var(--f-display); font-size: 18px; letter-spacing: .02em; vertical-align: bottom; }
.rd-tab td { padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: top; }
.rd-tab tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--k) 5%, var(--surface)); }
.rd-tab td:first-child { font-weight: 600; }
.rd-key, .rd-warn { border-radius: 12px; padding: 14px 18px; border-left: 6px solid var(--k); background: color-mix(in srgb, var(--k) 12%, var(--surface)); }
.rd-key::before, .rd-warn::before { content: "À retenir"; display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--k); margin-bottom: 4px; }
.rd-warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 11%, var(--surface)); }
.rd-warn::before { content: "Attention, piège"; color: var(--warn); }
.rd-defs, .rd-grid, .rd-stats, .rd-cmp { display: grid; gap: 12px; }
.rd-defs { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.rd-grid { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.rd-stats { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.rd-cmp { grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); }
.rd-defs > div, .rd-grid > div { background: color-mix(in srgb, var(--k) 7%, var(--surface)); border: 1px solid color-mix(in srgb, var(--k) 25%, var(--line)); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.rd-defs b, .rd-grid b { color: var(--k); font-family: var(--f-display); font-size: 20px; letter-spacing: .01em; line-height: 1.15; }
.rd-stats > div { border-radius: 14px; padding: 14px 16px; background: var(--k); color: #fff; display: flex; flex-direction: column; gap: 2px; }
.rd-stats b { font-family: var(--f-display); font-size: clamp(34px, 3.4vw, 46px); line-height: 1; }
.rd-stats span { font-size: 14.5px; line-height: 1.35; opacity: .95; }
.rd-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; counter-reset: st; }
.rd-steps li { counter-increment: st; position: relative; flex: 1 1 160px; background: color-mix(in srgb, var(--k) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--k) 30%, var(--line)); border-radius: 12px; padding: 34px 14px 12px; font-size: 15.5px; line-height: 1.4; }
.rd-steps li::before { content: counter(st); position: absolute; top: 8px; left: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--k); color: #fff; font: 700 12px/22px var(--f-mono); text-align: center; }
.rd-steps li:not(:last-child)::after { content: "→"; position: absolute; top: 6px; right: 10px; color: var(--k); font-weight: 700; }
.rd-formula { display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; padding: 18px; border-radius: 12px; background: color-mix(in srgb, var(--k) 10%, var(--surface)); border: 2px dashed color-mix(in srgb, var(--k) 55%, var(--line)); }
.rd-formula code { font-family: var(--f-mono); font-size: clamp(18px, 2vw, 26px); font-weight: 500; color: var(--k); }
.rd-formula span { font-size: 14.5px; color: var(--muted); max-width: 80ch; }
.rd-cmp > div { border-radius: 14px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--k) 35%, var(--line)); background: var(--surface); }
.rd-cmp h4 { margin: 0; padding: 10px 16px; background: var(--k); color: #fff; font-family: var(--f-display); font-size: 20px; letter-spacing: .01em; }
.rd-cmp ul { margin: 0; padding: 12px 16px 14px 34px; display: flex; flex-direction: column; gap: 6px; }
.rd-end { border-radius: 18px; padding: clamp(20px, 2.6vw, 34px); background: linear-gradient(135deg, color-mix(in srgb, var(--c) 22%, var(--surface)), var(--surface)); border: 2px solid var(--c); display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 84px; }
.rd-end h2 { font-size: clamp(26px, 2.8vw, 38px); }
.rd-end ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px 20px; }
.rd-end li { display: flex; gap: 10px; align-items: baseline; }
.rd-end li::before { content: "✓"; flex: none; color: var(--c); font-weight: 700; }
.rd-end .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.rd-files { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 15px; }
@media (max-width: 980px) {
  .rd-body { grid-template-columns: 1fr; padding-top: 16px; }
  .rd-toc { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .rd-toc .sect-lbl { display: none; }
  .rd-toc button { flex: none; background: var(--surface); border: 1px solid var(--line); }
  .rd-main { font-size: 16px; }
  .rd-steps li:not(:last-child)::after { content: "↓"; }
}
@media (max-width: 560px) { .rd-bar .hide-s { display: none; } }


/* Header */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
@media (max-width: 820px) { header.top { position: static; } }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding-block: 12px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-size: 26px; text-transform: uppercase; }
.brand span { color: var(--muted); font-size: 13px; }
.meter { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 13px; color: var(--muted); }
.meter .bar { width: 140px; height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--line) 70%, transparent); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.meter b { color: var(--ink); font-variant-numeric: tabular-nums; }
nav.tabs { display: flex; gap: 4px; width: 100%; overflow-x: auto; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 8px 12px; border-radius: 6px; font-weight: 600; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }

main { padding-block: 20px 60px; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 20px; margin-bottom: 16px; }
.view-head h2 { font-size: 30px; }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 65ch; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--surface)); padding: 2px 7px; border-radius: 4px; }
.time { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Week grid (desktop) */
.week { display: grid; grid-template-columns: 72px repeat(5, minmax(0, 1fr)); gap: 6px; }
.week .dh { font-family: var(--f-display); font-size: 19px; text-transform: uppercase; padding: 4px 2px; }
.week .dh small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--muted); text-transform: none; font-weight: 600; }
.week .dh.today { color: var(--accent); }
.week .rl { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding-top: 8px; }
.slot { min-width: 0; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 9px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; position: relative; }
.slot:hover { border-color: var(--c, var(--accent)); }
.slot.study { background: color-mix(in srgb, var(--c) 7%, var(--surface)); }
.slot .ttl { font-weight: 600; font-size: 14px; line-height: 1.25; }
.slot .meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.slot.done { opacity: .62; }
.slot.done .ttl { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink) 40%, transparent); }
.check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; font-size: 11px; }
.slot.done .check { background: var(--good); border-color: var(--good); color: var(--surface); }
.slot.rappel { background: transparent; border-style: dashed; padding: 6px 10px; }
.slot.rappel .ttl { font-size: 13px; }
.slot.rappel .sub { font-size: 12px; color: var(--muted); }
.slot.rappel.done { opacity: .55; }
.off { border-radius: var(--r); background: repeating-linear-gradient(135deg, transparent 0 8px, color-mix(in srgb, var(--line) 45%, transparent) 8px 9px); display: grid; place-items: center; color: var(--muted); font-weight: 600; font-size: 13px; text-align: center; padding: 8px; }
.slot.study[draggable="true"] { cursor: grab; }
.slot.dragging { opacity: .4; }
.slot.picked { outline: 2px dashed var(--accent); outline-offset: 2px; }
.over { outline: 2px solid var(--accent) !important; outline-offset: 2px; }
.off.drop { border: 1px dashed var(--line); min-height: 64px; }
.off.drop.target { border-color: var(--accent); color: var(--accent); cursor: pointer; background: color-mix(in srgb, var(--accent) 6%, transparent); }
.movebar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-radius: var(--r); padding: 10px 14px; margin-bottom: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); z-index: 4; }
@media (max-width: 820px) { .movebar { top: env(safe-area-inset-top, 0px); } }
.lunch { border-radius: var(--r); color: var(--muted); font-size: 12px; text-align: center; padding: 4px; border: 1px solid transparent; font-family: var(--f-mono); }

.mobile-week { display: none; }
@media (max-width: 820px) {
  .week { display: none; }
  .mobile-week { display: flex; flex-direction: column; gap: 18px; }
  .mday h3 { font-size: 20px; text-transform: uppercase; margin-bottom: 8px; }
  .mday h3 small { font-family: var(--f-body); font-size: 13px; color: var(--muted); text-transform: none; margin-left: 6px; }
  .mday .list { display: flex; flex-direction: column; gap: 6px; }
}

.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 18px; font-size: 13px; color: var(--muted); align-items: center; }
.legend .tag { margin-right: 4px; }
.setting { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.setting input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }

/* Today */
.today-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .today-grid { grid-template-columns: minmax(0, 1fr); } }
.timeline { display: flex; flex-direction: column; gap: 6px; }
.tl-row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: stretch; }
.tl-row .time { padding-top: 10px; }
.tl-row.now .time { color: var(--accent); font-weight: 700; }
.tl-row.now .slot { box-shadow: 0 0 0 2px var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h3 { font-size: 21px; }
.panel p { margin: 0; color: var(--muted); }
.daynav { display: flex; gap: 6px; align-items: center; }

/* Chapters */
.ue { margin-bottom: 26px; }
.ue > h3 { font-size: 22px; text-transform: uppercase; margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.ue > h3 small { font-family: var(--f-body); font-size: 13px; color: var(--muted); text-transform: none; font-weight: 600; }
.chgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.ch { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ch h4 { margin: 0; font-size: 15.5px; line-height: 1.25; }
.ch .when { font-size: 12.5px; color: var(--muted); }
.ch .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pips { display: flex; gap: 3px; }
.pips i { width: 14px; height: 6px; border-radius: 3px; background: var(--line); }
.pips i.on { background: var(--good); }
.mini { font-size: 12.5px; color: var(--muted); }

dialog { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }

.timer { font-family: var(--f-mono); color: var(--ink); }

.fb.good b { color: var(--good); } .fb.bad b { color: var(--warn); }

.grades { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

.empty { color: var(--muted); padding: 30px 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  { id: "cardio", subj: "phys", title: "Physiologie de l'exercice : système cardio-respiratoire", parts: 2,
    files: [["Cours", D("1Pe_babtOduOAxoKfmD0OmZ91BSJQmPmB")], ["Diaporama", D("15B2Gy32ZNvvoUygyV_WuH4xx6GRDAMPr")]],
    notions: ["Filières énergétiques", "Cascade de l'O2 et équation de Fick", "FC, VES, débit cardiaque, pression artérielle", "Redistribution du débit sanguin", "Transport de l'O2 : Hb, hématocrite, EPO, effet Bohr", "Ventilation et seuil ventilatoire"],
    cards: [
      ["Quelles sont les 3 filières énergétiques ?", "Anaérobie alactique (ATP-PCr, < 15 s), anaérobie lactique (glycogène → lactate, limite = acidose), aérobie (36 ATP, mitochondrie)."],
      ["Équation de Fick ?", "VO2 = Qc × (CaO2 − CvO2) = FC × VES × Da-v."],
      ["Formule de la FC maximale théorique ?", "FCmax = 220 − âge (Astrand)."],
      ["L'entraînement augmente-t-il la FC maximale ?", "Non. Il baisse la FC de repos, augmente la FC de réserve et le VES."],
      ["Que dit la loi de Frank-Starling ?", "Plus le volume télédiastolique augmente (cœur plus rempli), plus la contraction cardiaque est forte."],
      ["Formule de la pression artérielle moyenne ?", "PAM = (PAS + 2 × PAD) / 3 = Qc × résistances périphériques totales."],
      ["Qu'est-ce que la dérive cardiaque ?", "Hausse de la FC après 10-15 min d'effort constant, due à la déshydratation et à l'hémoconcentration."],
      ["Qu'est-ce que l'effet Bohr ?", "Décalage à droite de la courbe de dissociation de l'Hb (↑H+, ↑CO2, ↑T°) : l'Hb libère plus d'O2 au muscle."],
      ["Quel taux d'hématocrite fait suspecter un dopage ?", "Plus de 50 % (moyenne homme ≈ 42 %). L'EPO augmente la VO2max d'environ 10 %."],
      ["Formule de la ventilation ?", "VE = f × VT (6 à 10 L/min au repos, jusqu'à 130-200 L/min à l'effort)."]
    ] },
  { id: "nutri", subj: "adcp", title: "Nutrition et activité physique", parts: 2,
    files: [["Cours", D("1vfBinDnDd0vgCxQnJBuIAiIfEmjmgHEw")], ["Diaporama", D("1DFkhdkVe35wAaxrOlL3Uu3iH0Sq3iwL_")]],
    notions: ["Principes énergétiques et non énergétiques", "Dépense énergétique et MET", "Apports recommandés (quantité et qualité)", "PNNS, Nutri-Score, IMC", "Index glycémique, eau, ergogènes"],
    cards: [
      ["Combien de kcal apporte 1 g de glucides, protides, lipides, alcool ?", "Glucides 4, protides 4, lipides 9, alcool 7."],
      ["Quelles vitamines sont liposolubles ?", "A, D, E, K (stockées : risque d'hypervitaminose). Les 9 autres (B et C) sont hydrosolubles."],
      ["Que vaut 1 MET ?", "3,5 mL d'O2/min/kg, soit la consommation d'oxygène au repos. 1 L d'O2 ≈ 5 kcal."],
      ["Répartition des apports recommandée chez le sportif ?", "Glucides 50-60 %, protides 10-20 %, lipides 30-35 %, alcool ≤ 5 %."],
      ["Formule et zone normale de l'IMC ?", "IMC = poids / taille². Normal entre 18,5 et 24,9 ; obésité à partir de 30."],
      ["Qu'est-ce que l'hypoglycémie réactionnelle ?", "Une chute brutale de la glycémie après une grosse prise de sucre rapide, due au pic d'insuline."],
      ["Besoin en eau quotidien ?", "40 mL/kg/jour, dont la moitié couverte par l'alimentation. −1 % d'eau ≈ −10 % de performance."],
      ["Quelle stratégie fait perdre le plus de masse grasse ?", "Régime + exercice combinés (−250 kcal d'apports et +250 kcal de dépense par jour)."]
    ] },
  { id: "depense", subj: "adcp", title: "Activité physique et dépense énergétique", parts: 2,
    files: [["Cours", D("1KnOGU-aJcGsYdIQUNEJTERAJxoBJnoOM")], ["Diaporama 1", D("1qOMtJMOijWV15gDxgq39lfcZMrDeRA9Q")], ["Diaporama 2", D("13zS80evNx5HASZbS_zMrpguj9_HwcxiX")]],
    notions: ["DEJ = NMR + TIA + DEAP", "NAP = DEJ / NMR", "Intensité absolue et relative, classification en MET", "Méthodes de mesure critériées, subjectives, objectives", "Quotient respiratoire et quotient alimentaire"],
    cards: [
      ["Composantes de la dépense énergétique journalière ?", "NMR (60-75 %), thermogenèse induite par l'alimentation (~10 %), DEAP (15-30 %, la plus variable)."],
      ["Formule du NAP et valeur pour un sédentaire ?", "NAP = DEJ / NMR. Sédentaire ≈ 1,2 ; actif > 1,67."],
      ["Seuils en MET des intensités ?", "< 1,5 sédentarité ; < 3 légère ; 3 à 6 modérée ; > 6 intense ; > 9 très intense."],
      ["Différence entre intensité absolue et relative ?", "Absolue : L d'O2/min ou MET. Relative : % de VO2max ou de FCmax, tient compte des capacités de chacun."],
      ["Valeurs du QR selon le substrat ?", "Glucides 1 ; lipides 0,7 ; protéines 0,82."],
      ["Principe de l'eau doublement marquée ?", "On boit de l'eau marquée au ²H et à l'¹⁸O ; la différence de vitesse d'élimination donne la production de CO2, donc la dépense sur 1 à 3 semaines."],
      ["Limite du podomètre ?", "Il perd sa validité en course (la longueur de pas augmente avec la vitesse)."],
      ["Coût de la thermogenèse selon le nutriment ?", "Glucides 5-10 %, protéines 20-30 %, lipides < 5 % de l'énergie ingérée."]
    ] },
  { id: "dqp", subj: "adcp", title: "Développement des qualités physiques", parts: 2,
    files: [["Cours", D("1yNS1V-H1yOyavTJrpsuDFWYPQMVRVirj")], ["Diaporama", D("1CqR2Tt71PfzL-9mnkucmZ6nbqhh00uKg")]],
    notions: ["Les 6 principes de l'entraînement", "Les formes de force et leurs déterminants", "Méthodes : Zatsiorski, isométrie, excentrique, pliométrie", "Vitesse et agilité", "Endurance (signalée hors examen 2025-2026)"],
    cards: [
      ["Quels sont les 6 principes de l'entraînement ?", "Spécificité, transfert, surcharge, alternance, progression, surcompensation."],
      ["Qu'est-ce que la surcompensation ?", "L'élévation de la capacité de performance après une charge de travail suivie d'une phase de récupération."],
      ["Comment mesure-t-on la force maximale en pratique ?", "Avec la 1 RM : la charge mobilisable une seule fois."],
      ["D'où viennent les premiers gains de force ?", "D'adaptations nerveuses (coordination inter- puis intramusculaire), avant l'hypertrophie."],
      ["Qu'est-ce que la pliométrie ?", "Une contraction excentrique suivie d'une concentrique (cycle étirement-raccourcissement) : développe la puissance et l'explosivité."],
      ["Avantage et limite du travail isométrique ?", "Tension supérieure d'environ 10 % au concentrique, mais gains surtout à l'angle travaillé."],
      ["Définition de l'agilité (Sheppard et Young) ?", "Capacité à changer de vitesse ou de direction en réponse à un stimulus."],
      ["Quelles sont les 3 méthodes de Zatsiorski ?", "Efforts maximaux, efforts répétés (jusqu'à la fatigue, hypertrophie), efforts dynamiques (vitesse maximale)."]
    ] },
  { id: "tdadcp", subj: "adcp", title: "TD de condition physique", parts: 1,
    files: [["TD 1 sujet", D("1_kUSYW79AqCSXChwXQ_9-KDsQywH1soW")], ["TD 2 sujet", D("16SKo4dS5lRv46vILMoirlhNBC-hCU8__")], ["TD 1 et 2 corrigé", D("1v7IKV6fRPpHFqp6LgSUdbuMmFrD1slfW")]],
    notions: ["Refaire TD 1 et TD 2 sans le corrigé", "Calculs : MET, NAP, DEJ, IMC, QA", "Comparer avec le corrigé", "Ficher les erreurs"],
    cards: [
      ["Dépense de repos d'un adulte de 60 kg avec la méthode MET ?", "3,5 × 60 = 210 mL/min = 0,21 L/min × 5 kcal = 1,05 kcal/min, soit ≈ 1512 kcal/jour."],
      ["Calculer le QA d'une ration 55 % glucides, 35 % lipides, 10 % protides.", "0,55 × 1 + 0,35 × 0,7 + 0,10 × 0,82 ≈ 0,877."],
      ["Si QA < QR, quel risque ?", "La part de lipides dépasse les capacités d'oxydation : risque de prise de poids."],
      ["Formule de la DEAP en tenant compte de la thermogenèse ?", "DEAP = (DEJ × 0,9) − NMR."]
    ] },
  { id: "attach", subj: "psy", title: "L'attachement (et fiche définitions)", parts: 2,
    files: [["Cours", D("17wodxohCX2o6XmweFUtsakgHdtqmttip")], ["Fiche définitions", D("1I5Q38jAx8jaW1d_i_oeNQRVs-595hOqV")], ["Diaporama", D("1r5b9SfhzMDQX9ClkKtY7lSSxmmKvtlqj")]],
    notions: ["Définitions : Guedeney, Bowlby", "Précurseurs : Lorenz, Spitz, Harlow", "Bowlby : étapes, phases de séparation, caregiving", "Ainsworth : situation étrange et 4 profils", "Régulation émotionnelle (Gross et Thompson)", "Parentalité, maltraitance, borderline"],
    cards: [
      ["Définition de l'attachement selon Guedeney ?", "Un ensemble de liens interpersonnels, affectifs, durables et importants entre 2 personnes."],
      ["Qu'a montré Spitz ?", "L'hospitalisme : des nourrissons séparés durablement développent un état dépressif."],
      ["Qu'a montré Harlow ?", "Avec des macaques privés de mère : comportements perturbés jusqu'à l'âge adulte ; un leurre (doudou) réduit l'agressivité."],
      ["Les 3 phases de réaction à la séparation selon Bowlby ?", "Protestation, désespoir, détachement."],
      ["À partir de quel âge l'attachement est-il franc selon Bowlby ?", "Vers 7 mois (substitution plus possible). Partenariat ajusté vers 3-4 ans."],
      ["Les 4 profils de la situation étrange d'Ainsworth ?", "Sécure (60-65 %), anxieux-évitant (~20 %), anxieux-ambivalent (~15 %), désorganisé (~5 %, Main et Solomon)."],
      ["Les 2 stratégies de régulation émotionnelle de Gross et Thompson ?", "La réévaluation cognitive et la suppression expressive."],
      ["Qu'est-ce que le caregiving ?", "Le « donneur de soin » : toute personne capable de déceler la détresse et de réconforter l'enfant."]
    ] },
  { id: "ado", subj: "psy", title: "L'adolescence", parts: 2,
    files: [["Cours", D("1nqiALjeLLy5YphZZ6ZFte-5NUml5c8vh")], ["Diaporama", D("1k0xMJVejqQ3taD2-7agBWPka1h-RUpj6")]],
    notions: ["Définitions : Ariès, Mead, Jeammet, Marty", "3 phases du comportement social", "Puberté, addictions, autonomie, sommeil", "Violences sexuelles et loi de 2024 dans le sport", "Anxiété, suicide, cerveau adolescent", "Pratiques culturelles, ennui, sexualisation"],
    cards: [
      ["Définition de l'adolescence selon Jeammet ?", "Une étape sensible du développement de la personnalité, marquée par une vulnérabilité liée aux effets psychiques et physiques de la puberté."],
      ["Les 3 phases du comportement social de l'adolescent ?", "Opposition, affirmation de soi, indépendance."],
      ["Les 3 autonomies à acquérir pour devenir adulte ?", "Physique, psychique et financière (plus l'acceptation de l'autorité)."],
      ["Que montre Carskadon sur le sommeil ?", "Le besoin passe d'environ 10 h au début de l'adolescence à 8 h à la fin."],
      ["Pourquoi l'anxiété augmente-t-elle à l'adolescence selon Hercberg ?", "La THP (alloprégnanolone) inhibe le GABA, l'anxiolytique naturel du cerveau."],
      ["Que dit Le Breton sur l'auto-initiation ?", "La disparition des rites de passage pousse l'adolescent à créer ses propres rites, parfois dangereux."],
      ["Selon Jeammet (2016), que peut signifier le suicide chez certains jeunes ?", "Un appel à exister, une façon désespérée d'être entendu, pas toujours un désir de mort."],
      ["À quel âge le cerveau atteint-il sa maturité ?", "Entre 21 et 25 ans (remodelage dès 10-12 ans)."]
    ] },
  { id: "socdel", subj: "psy", title: "Socialisation et délinquance", parts: 1,
    files: [["Cours", D("1msAVSkNwTG7D-zHDf2gxnMsxo7I82J3P")], ["Diaporama", D("1W8tm7q1t3DfokHKPUGBk11hbjO4mAPtd")]],
    notions: ["Socialisation primaire et secondaire, normes, valeurs, rôle, statut", "Malrieu et Tap", "Montagner, Gesell, Piaget, Luquet", "Chombart de Lauwe, Moreno, phobie scolaire", "Sanctions : Kant, Tocqueville, Durkheim", "Délinquance sexuelle : Becker, Vizard"],
    cards: [
      ["Définition de la socialisation ?", "L'ensemble des processus par lesquels les individus intériorisent les valeurs et les normes de leur société."],
      ["Délinquance et déviance : quelle différence ?", "Délinquance : s'écarter des normes juridiques. Déviance : s'éloigner volontairement des normes sociales."],
      ["Les 2 processus de socialisation selon Malrieu ?", "L'acculturation et la subjectivation."],
      ["Les 6 profils de Montagner chez le jeune enfant ?", "Leaders, dominants-agressifs, dominés-craintifs, dominés-agressifs, dominés, isolés."],
      ["Les 3 types de jeux selon Piaget ?", "Jeux d'exercice, jeux symboliques, jeux de règles."],
      ["Les stades du dessin selon Luquet ?", "Gribouillage, réalisme fortuit, réalisme manqué, réalisme intellectuel."],
      ["Les 3 orientations de la sanction ?", "Kant : punition rétributive. Tocqueville : resocialisation. Durkheim : peine exemplaire."],
      ["Classification de Moreno en classe ?", "Préférés, rejetés, isolés, controversés."]
    ] },
  { id: "sdef", subj: "soc", title: "Définition de la sociologie et définitions du sport", parts: 1,
    files: [["Cours", D("1VWELOG9dBUxiXBNph94E6H8c38pjkkYc")], ["Diaporama", D("1EXB38Urq4-0g6eRPqLs69egSBVipVRZg")]],
    notions: ["Sociologie : science de la logique des rapports sociaux", "Bourdieu : à quoi sert la sociologie", "Prénotions (Durkheim) et préjugés", "Définitions du sport : Bromberger, Bouet, Defrance", "Fonctionnalismes positif et négatif"],
    cards: [
      ["Définition de la sociologie (Moreau de Bellaing et Poussin) ?", "La science de la logique des rapports sociaux."],
      ["Les 4 ruptures que vise la sociologie ?", "Contre les représentations collectives, l'illusion du savoir immédiat, la sociologie spontanée et les jugements de valeur."],
      ["Qu'est-ce qu'une prénotion selon Durkheim ?", "Une représentation schématique et sommaire formée par la pratique, qui tire son autorité des fonctions sociales qu'elle remplit."],
      ["Qui a dit que définir le sport est « un pari intenable » ?", "Bromberger (1995)."],
      ["Fonctions positives du sport ?", "Sanitaire, bien-être social, euphémisation de la violence, éducative, symbolique."],
      ["Critique du fonctionnalisme négatif ?", "Le sport détourne la conscience politique et exprime le capitalisme (consommation, dopage, corruption)."]
    ] },
  { id: "smeth", subj: "soc", title: "Démarches et méthodes de la sociologie", parts: 1,
    files: [["Cours", D("1ZvnsXHMUJs2ramDxbw_4ssJ-iY4srdx9")], ["Diaporama", D("1Vxq-GlsxrFgfhZq-IcjXPivnoE_NHXsO")]],
    notions: ["Démarche scientifique et 7 étapes en sciences sociales", "Modèle de Weber", "Démarche inductive et déductive", "Questionnaire, échantillon, variables", "Entretien, reformulation, observation"],
    cards: [
      ["Démarche inductive ou déductive : laquelle part du terrain ?", "L'inductive (du spécifique au général). La déductive part de la théorie."],
      ["Qu'est-ce qu'un échantillon par quotas ?", "Un échantillon représentatif construit selon des caractéristiques de la population (âge, sexe, PCS, lieu)."],
      ["Variable dépendante ou indépendante : laquelle explique ?", "L'indépendante explique (âge, sexe, PCS). La dépendante est celle qu'on cherche à expliquer."],
      ["Une corrélation prouve-t-elle une causalité ?", "Non, elle peut seulement la suggérer."],
      ["Quel entretien est le plus utilisé en sociologie ?", "L'entretien semi-directif (grille de 3 à 5 thèmes, ordre libre)."],
      ["Citez 3 modes de reformulation.", "Le reflet, l'écho, la clarification (aussi : inversée, déductive/inductive, appui)."],
      ["Les 2 critères du statut d'observateur ?", "À découvert ou incognito ; participante ou en retrait."]
    ] },
  { id: "secole", subj: "soc", title: "École et inégalités scolaires", parts: 1,
    files: [["Cours", D("1LU2SJ18PPSDZTDah5V7URPKf8mc6YCkn")], ["Diaporama", D("1V3JGz9hfSt3CCHXx0W5zFl_iBvynXqNh")]],
    notions: ["Massification et démocratisation ségrégative", "Bourdieu et Passeron : reproduction, violence symbolique", "Capitaux, habitus, champ", "Boudon : effet de ciseaux", "Effet établissement, composition des classes, pédagogies"],
    cards: [
      ["Que dit la théorie de la reproduction (Bourdieu et Passeron) ?", "L'école reproduit et légitime les inégalités : elle valorise la culture dominante dont héritent les enfants favorisés."],
      ["Quels sont les 4 capitaux de Bourdieu ?", "Économique, culturel, social, symbolique."],
      ["Définition de l'habitus ?", "Un système de dispositions durables et transposables, structuré et structurant, qui oriente nos façons de percevoir, penser et agir."],
      ["Qu'est-ce que l'effet de ciseaux de Boudon ?", "Les bacheliers augmentent plus vite (10 → 63 %) que les postes de cadres (5 → 15 %) : les diplômes se dévaluent."],
      ["Taux de bac selon l'origine sociale ?", "Environ 75 % pour les enfants d'enseignants contre 34 % pour les enfants d'ouvriers."],
      ["Que montre l'effet de la composition des classes ?", "La mixité de niveau profite à tous ; regrouper les faibles fait baisser leur niveau."]
    ] },
  { id: "strib", subj: "soc", title: "Monde des tribunes sportives", parts: 1,
    files: [["Cours", D("1Y2lOpaJSmtHesLVzHz5Z1TMowzFgLLc1")]],
    notions: ["Profil des spectateurs", "Supportérisme officiel et autonome", "Ultras et hools", "Violences et relations intergroupes", "Lois : Alliot-Marie 1993, 2006, Larrivé 2016 ; IJS et IAS"],
    cards: [
      ["Différence entre ultras et hools ?", "Ultras : associations structurées qui animent les tribunes (Europe du Sud). Hools : bandes éphémères à visée violente (Europe du Nord)."],
      ["Part des femmes et des moins de 35 ans dans les tribunes ?", "Femmes ≤ 15 % ; 70 % des spectateurs ont moins de 35 ans."],
      ["Citez 3 formes d'expression des ultras.", "La bâche, le tifo, le capo, l'écharpe."],
      ["Qu'a créé la loi Alliot-Marie de 1993 ?", "Des délits spécifiques aux manifestations sportives et l'interdiction judiciaire de stade (IJS, max 5 ans)."],
      ["Différence entre IJS et IAS ?", "IJS : sanction pénale prononcée par un juge. IAS (2006) : mesure de police administrative du préfet, max 2 ans (3 si récidive)."],
      ["Apport de la loi Larrivé (2016) ?", "Un référent supporters dans chaque club pro et une instance nationale du supportérisme."]
    ] },
  { id: "sprat", subj: "soc", title: "Pratiques physiques et sportives en 2025", parts: 1,
    files: [["Cours", D("1mWroVTjBWlpyDbcTJkO7VWLhNgvg2oL1")], ["Diaporama", D("1fMDDXTfZGFIsSopXwVgKLU5NGTS7HQj6")]],
    notions: ["Massification, individualisation, démocratisation relative, féminisation", "8 facteurs du développement des APS", "Stagnation du sport fédéral", "Raisons de l'abandon des clubs", "Âge, diplôme et niveau de vie"],
    cards: [
      ["Part de la population ayant pratiqué au moins une fois dans l'année ?", "89 % (65 % au moins une fois par semaine)."],
      ["Activité la plus pratiquée ?", "La marche (35,6 millions), devant la natation et le vélo."],
      ["Les 4 pôles de motivation ?", "Santé et bien-être, convivialité, nature, motivations physiques. La compétition ne motive que 21 % des pratiquants."],
      ["Citez 4 facteurs du développement des APS.", "Baisse du temps de travail, hausse du pouvoir d'achat, allongement de la scolarité, politiques publiques (aussi : technologie, industrie du loisir, féminisation, icônes)."],
      ["Freins à la pratique en club ?", "Coût de la licence, cadre rigide, logique compétitive, ambiance, manque d'encadrement."],
      ["Effet du diplôme sur la pratique ?", "88 % des diplômés du supérieur pratiquent contre 45 % des peu ou pas diplômés."]
    ] },
  { id: "sdop", subj: "soc", title: "Sociologie d'une infraction sportive : le dopage", parts: 1,
    files: [["Cours", D("1NZpOS01wRfDuCZzGjSWj9bojBvqnLJtB")]],
    notions: ["Problème de définition et loi de 1965", "Facteurs contextuels : représentativité nationale, professionnalisation, commercialisation", "Système de valeurs du haut niveau", "Médicalisation et environnement propice", "Enjeux du spectacle sportif"],
    cards: [
      ["Date de la première loi anti-dopage ?", "1965."],
      ["Quel exemple de dopage d'État cite le cours ?", "L'ex-RDA : dopage institutionnalisé d'environ 10 000 athlètes, de 25 médailles (1968) à 101 (1988)."],
      ["Mesures de Samaranch ?", "1981 : JO ouverts aux professionnels. 1986 : commercialisation des emblèmes olympiques."],
      ["Les 4 critères du système de valeurs du sport de haut niveau ?", "Performance à tout prix, repousser ses limites, jouer avec la souffrance, sens du sacrifice."],
      ["Pourquoi le dopage est-il dit « hyper-conforme » ?", "Parce qu'il pousse à l'extrême les normes du sport de haut niveau au lieu de s'en écarter."]
    ] },
  { id: "ssante", subj: "soc", title: "Sport et santé : regards sociologiques", parts: 1,
    files: [["Cours", D("1Mi2gIA_plzkPUvN3siZHwTZZSvNw5LHQ")], ["Diaporama", D("1MeN6jIHjueB3255k8RrvLv08zrn6sFhj")]],
    notions: ["Santé, prévention primaire, secondaire, tertiaire", "Recommandations OMS", "Effets de l'AP sur la santé", "Inégalités sociales de santé", "PNNS, Stratégie nationale sport santé, sport sur ordonnance"],
    cards: [
      ["Les 3 types de prévention selon l'OMS ?", "Primaire (avant la maladie, ↓ incidence), secondaire (au début, dépistage), tertiaire (maladie installée, ↓ incapacités et récidives)."],
      ["Recommandation OMS pour les 18-64 ans ?", "Au moins 150 min d'endurance modérée ou 75 min soutenue par semaine."],
      ["Recommandation OMS pour les 5-17 ans ?", "Au moins 1 h par jour d'activité modérée à soutenue."],
      ["Quelle est la 1re cause de mortalité évitable dans les pays développés ?", "L'inactivité physique (devant le tabac)."],
      ["Qu'est-ce que le gradient social de santé ?", "Chaque catégorie sociale a une mortalité et une morbidité plus élevées que la catégorie juste au-dessus."],
      ["Quelle loi permet le « sport sur ordonnance » ?", "La loi de modernisation du système de santé du 26 janvier 2016 (APA pour les patients en ALD)."],
      ["Date du 1er PNNS ?", "2001."]
    ] },
  { id: "sinteg", subj: "soc", title: "Sport, socialisation et intégration sociale", parts: 1,

      { t: "qcm", q: "Une boîte avec un rectangle rouge « Uniquement sur ordonnance » contient un médicament :", o: ["De liste I", "De liste II", "D'exception", "Hors liste"], a: 0, e: "Liste II = liseré vert. Médicament d'exception = vignette blanche à liseré vert (ancienne présentation)." },
      { t: "qcm", q: "Durée maximale de prescription d'un hypnotique (ex. Imovane®) ?", o: ["4 semaines", "12 semaines", "28 jours renouvelables 11 fois", "1 an"], a: 0, e: "Anxiolytiques : 12 semaines. Liste I classique : 1 an." },
      { t: "qcm", q: "Lequel n'est PAS une obligation pour un assimilé stupéfiant ?", o: ["Ordonnance sécurisée", "Nombre de spécialités dans le carré", "Stockage au coffre", "Conservation de la copie 3 ans"], a: 2, e: "Pas de coffre, pas de registre, pas de délai de carence de 3 jours pour les assimilés." },
      { t: "qcm", q: "Les sétrons (ex. Zophren®) sont un exemple de :", o: ["Stupéfiants", "Médicaments d'exception", "Médicaments réservés à l'hôpital", "Médication officinale"], a: 1, e: "Remboursés uniquement pour les nausées et vomissements des chimio- et radiothérapies anticancéreuses (ordonnance bleue Cerfa 12708)." },
      { t: "qcm", q: "Qui délivre une AMM européenne par procédure centralisée ?", o: ["L'ANSM", "La HAS", "L'EMA", "Le CEPS"], a: 2, e: "L'EMA siège à Amsterdam depuis le Brexit (avant à Londres)." },
      { t: "qcm", q: "Quel taux de remboursement n'existe PAS ?", o: ["15 %", "30 %", "50 %", "65 %"], a: 2, e: "Taux possibles : 0, 15, 30, 65 et 100 %." },
      { t: "qcm", q: "Le Roaccutane® (isotrétinoïne) est classé :", o: ["Réservé à l'usage hospitalier", "Sous surveillance particulière pendant le traitement", "Stupéfiant", "Hors liste"], a: 1, e: "Test de grossesse sanguin chaque mois et carnet de suivi, car la molécule est très tératogène." },
      { t: "vf", q: "Un produit de désinfection des prothèses dentaires est un médicament.", v: false, e: "Exclu par la définition, comme les désinfectants des locaux. Un bain de bouche, en contact avec la muqueuse, est un médicament." },
      { t: "vf", q: "En cas de doute entre médicament et complément alimentaire, on applique le statut de médicament.", v: true, e: "C'est la législation la plus stricte qui l'emporte." },
      { t: "vf", q: "Une AMM est valable 5 ans puis, après renouvellement, pour une durée illimitée.", v: true, e: "Sauf données négatives de pharmacovigilance pouvant conduire à son retrait." },
      { t: "vf", q: "Les préparations magistrales doivent obtenir une AMM.", v: false, e: "Seules les spécialités pharmaceutiques ont besoin d'une AMM." },
      { t: "vf", q: "Pour la méthadone ou la Ritaline®, le nom de la pharmacie doit figurer sur l'ordonnance.", v: true, e: "Mesure contre le nomadisme pharmaceutique ; le patient reste libre de choisir sa pharmacie." },
      { t: "vf", q: "L'ANSM a été créée en 2012 après la loi Bertrand.", v: true, e: "Elle a remplacé l'AFSSAPS (après le scandale du Mediator®)." }
    ] },

  /* ---------- 2. Dispositifs médicaux (B. Decaudin) ---------- */
  { id: "p_dm", subj: "maps", title: "Dispositifs médicaux : définitions et mise sur le marché (B. Decaudin)", parts: 1,
    src: NO_SUP,
    files: [["CM vidéo (Moodle)", MOODLE_MAPS], ["Dossier Supmed 2022-2023", SUP_FC]],
    notions: ["Définition du dispositif médical (DM) et différence avec le médicament", "Règlements européens 2017/745 (DM) et 2017/746 (DM de diagnostic in vitro)", "Classes de risque I, IIa, IIb, III", "Marquage CE et organisme notifié (pas d'AMM)", "Matériovigilance (ANSM), remboursement (LPP, CNEDiMTS de la HAS)"],
    cards: [
      ["Qu'est-ce qui distingue un DM d'un médicament ?", "Le mode d'action principal : le DM agit par des moyens physiques ou mécaniques, pas pharmacologiques, immunologiques ou métaboliques."],
      ["Quels règlements européens encadrent les DM et les DMDIV ?", "Règlement (UE) 2017/745 pour les DM (applicable depuis mai 2021) et 2017/746 pour les DM de diagnostic in vitro (mai 2022)."],
      ["Quelles sont les 4 classes de risque des DM ?", "I (faible), IIa (modéré), IIb (élevé), III (le plus élevé)."],
      ["Quel est le rôle d'un organisme notifié ?", "Évaluer la conformité des DM à risque (Is, Im, IIa, IIb, III) avant le marquage CE ; en France, le GMED."],
      ["Comment s'appelle la vigilance des DM ?", "La matériovigilance (réactovigilance pour les DM de diagnostic in vitro), gérée par l'ANSM."],
      ["Quelle commission de la HAS évalue les DM en vue du remboursement ?", "La CNEDiMTS, qui donne un avis sur le service attendu (SA) et l'amélioration du service attendu (ASA) pour l'inscription sur la LPP."],
      { t: "qcm", q: "Un DM est mis sur le marché grâce à :", o: ["Une AMM de l'ANSM", "Un marquage CE", "Un avis de la HAS", "Un enregistrement à l'EMA"], a: 1, e: "Les DM n'ont pas d'AMM ; le marquage CE atteste leur conformité." },
      { t: "qcm", q: "Quel DM est de classe III ?", o: ["Compresse", "Lentille de contact", "Valve cardiaque", "Fauteuil roulant"], a: 2, e: "Les implants en contact avec le cœur sont dans la classe de risque la plus élevée." },
      { t: "qcm", q: "Un cathéter imprégné d'héparine (action accessoire) est :", o: ["Un médicament", "Un DM de classe I", "Un DM de classe III", "Un complément alimentaire"], a: 2, e: "DM incorporant une substance médicamenteuse à action accessoire : classe III." },
      { t: "qcm", q: "Pour quel DM le fabricant peut-il s'auto-certifier ?", o: ["Classe I non stérile sans fonction de mesure", "Classe IIa", "Classe IIb", "Classe III"], a: 0, e: "Toutes les autres classes nécessitent un organisme notifié." },
      { t: "vf", q: "Un test de grossesse est un DM de diagnostic in vitro.", v: true, e: "Il relève du règlement (UE) 2017/746." },
      { t: "vf", q: "Un logiciel peut être un dispositif médical.", v: true, e: "S'il a une finalité médicale définie par le fabricant (ex. aide au diagnostic)." },
      { t: "vf", q: "La durée d'utilisation « court terme » d'un DM correspond à moins de 60 minutes.", v: false, e: "< 60 min = temporaire ; court terme = jusqu'à 30 jours ; long terme = plus de 30 jours." },
      { t: "vf", q: "Les incidents graves liés à un DM se déclarent à l'ANSM.", v: true, e: "C'est la matériovigilance." }
    ] },

  /* ---------- 3. DM de la perfusion (M. Masse) ---------- */
  { id: "p_perf", subj: "maps", title: "Les dispositifs médicaux de la perfusion (M. Masse)", parts: 1,
    src: NO_SUP + " Le passage sur la perfusion intraveineuse vient de la fiche Supmed n°4 (voies parentérales).",
    files: [["CM vidéo (Moodle)", MOODLE_MAPS], ["Fiche Supmed voies parentérales (perfusion IV)", D("17oa7rJXzoQ5pMqIPjE54n2C_SnhvxY39")]],
    notions: ["Perfusion par gravité : perfuseur, compte-gouttes, régulateur", "Calcul du débit en gouttes/min (20 gouttes = 1 mL)", "Systèmes actifs : pousse-seringue électrique, pompe volumétrique, PCA", "Diffuseurs portables (élastomériques)", "Accès veineux : cathéter périphérique, PICC, cathéter central, chambre implantable", "Matériaux, interactions contenant-contenu et risques"],
    cards: [
      ["Combien de gouttes font 1 mL avec un perfuseur standard ?", "20 gouttes (60 avec un perfuseur pédiatrique à micro-gouttes)."],
      ["Calcule le débit pour 500 mL en 4 heures avec un perfuseur standard.", "500 × 20 / 240 ≈ 42 gouttes par minute."],
      ["Calcule le débit pour 1 L en 24 heures (perfuseur standard).", "1000 × 20 / 1440 ≈ 14 gouttes par minute."],
      ["De quoi est composé un perfuseur ?", "Perforateur, prise d'air (flacons rigides), chambre compte-gouttes, filtre, tubulure, régulateur à roulette, site d'injection, raccord Luer-lock."],
      ["Quand préfère-t-on un pousse-seringue électrique ?", "Pour de petits volumes à débit faible et très précis : médicaments puissants (catécholamines, anesthésiques, insuline IV, morphine)."],
      ["Qu'est-ce qu'un diffuseur élastomérique ?", "Un ballon élastique qui se rétracte et pousse la solution à débit fixe (capillaire calibré), sans électricité : perfusions à domicile."],
      ["Qu'est-ce qu'une chambre à cathéter implantable ?", "Un boîtier placé sous la peau, relié à un cathéter central, que l'on pique avec une aiguille de Huber ; pour les traitements longs comme la chimiothérapie."],
      { t: "qcm", q: "Quel facteur ne modifie PAS le débit d'une perfusion par gravité ?", o: ["La hauteur de la poche", "La viscosité du soluté", "Le calibre du cathéter", "La couleur de la tubulure"], a: 3, e: "Une tubulure opaque protège seulement les médicaments photosensibles." },
      { t: "qcm", q: "Quel cathéter périphérique est le plus fin ?", o: ["14G", "18G", "20G", "24G"], a: 3, e: "Plus le nombre de gauge est élevé, plus le cathéter est fin." },
      { t: "qcm", q: "Quel matériau peut adsorber l'insuline ou les dérivés nitrés ?", o: ["Le PVC", "Le verre de type I", "Le titane", "Le silicone médical"], a: 0, e: "D'où le choix de tubulures adaptées pour ces médicaments." },
      { t: "qcm", q: "Une pompe PCA sert à :", o: ["Perfuser des grands volumes de soluté", "Laisser le patient s'administrer des bolus d'antalgique", "Filtrer les bactéries", "Mesurer la pression veineuse"], a: 1, e: "PCA = analgésie contrôlée par le patient, dans des limites programmées." },
      { t: "vf", q: "On peut perfuser une solution huileuse par voie intraveineuse.", v: false, e: "Jamais de solution huileuse en IV ; seulement des émulsions huile dans eau." },
      { t: "vf", q: "Une pompe volumétrique possède des alarmes d'occlusion et d'air dans la ligne.", v: true, e: "C'est un de ses avantages par rapport à la gravité." },
      { t: "vf", q: "Le débit d'une perfusion par gravité est très précis.", v: false, e: "Il varie avec la hauteur, la position du patient, la viscosité… d'où les pompes pour les médicaments à risque." }
    ] },

  /* ---------- 4. Sources du médicament 1 (S. Sahpaz) ---------- */
  { id: "p_nat1", subj: "maps", title: "Sources du médicament : produits de santé naturels 1 (S. Sahpaz)", parts: 1,
    src: "Fiche Supmed 2022-2023 n°3 « Médicaments et produits de santé naturels », parties 1 et 2 (pages 1 à 19).",
    files: [["Fiche Supmed partie 1", D("1xF32JbedRUIUPtmmtOvqWSRlbWxJFZXp")], ["Fiche Supmed partie 2", D("1OcN-lrOr8XF3iv0GdihYC8EcqPw7HMIf")], ["QCM sujet", D("1vZr4n9kCIsCu61Qs9vCgyCu8slLpdQF2")], ["QCM corrigé", D("1KOSOcXznUMA5Z4NglxnayvrovR3H-Nbn")], ["CM vidéo (Moodle)", MOODLE_MAPS]],
    notions: ["Pharmacognosie : définition et histoire (Hippocrate, Dioscoride)", "Aspirine, dicoumarol, morphine : médicaments d'origine naturelle", "Statuts : médicament à base de plantes, complément alimentaire, DM", "Les 4 sources : végétaux, animaux, micro-organismes, organismes marins", "Stratégies de sélection : criblage, ethnopharmacologie, chimiotaxonomie, criblage écologique", "Production : extraction, hémisynthèse, biotechnologies ; classification des PA"],
    cards: [
      ["Que signifie « pharmacognosie » ?", "Pharmakon (remède/poison) + gnosis (connaissance) : l'étude des substances naturelles utilisées en thérapeutique."],
      ["Qui est considéré comme le père de la pharmacognosie et quelle est son œuvre ?", "Dioscoride, médecin grec du Ier siècle, auteur de De Materia Medica (plus de 500 plantes)."],
      ["Comment le dicoumarol a-t-il été découvert ?", "Par des hémorragies chez le bétail nourri de mélilot mal séché et moisi : la coumarine s'y dégrade en dicoumarol, un anti-vitamine K."],
      ["Donne les 3 statuts possibles d'un produit à base de plantes.", "Médicament à base de plantes (AMM, pharmacie), complément alimentaire (déclaration DGCCRF, vente libre), dispositif médical (action physique)."],
      ["Quelles sont les 4 grandes sources naturelles de principes actifs ?", "Végétaux, animaux, micro-organismes (bactéries, champignons) et organismes marins."],
      ["Qu'est-ce que la méthode ethnopharmacologique ?", "Partir de l'usage traditionnel d'une source naturelle par une population pour chercher la molécule active."],
      ["Qu'est-ce que l'hémisynthèse ?", "La modification chimique d'une molécule naturelle extraite pour obtenir un PA (ex. codéine à partir de la morphine)."],
      ["Quelles sont les 4 phases des essais cliniques ?", "I : sécurité chez des volontaires sains ; II : dose optimale chez des malades ; III : efficacité contre référence ou placebo ; IV : surveillance après l'AMM."],
      { t: "qcm", q: "Quelle proportion des principes actifs vient de sources naturelles ?", o: ["Environ 25 %", "Environ 54 %", "Environ 80 %", "Environ 95 %"], a: 1, e: "75 % si on compte aussi les excipients ; plus de 60 % des anticancéreux." },
      { t: "qcm", q: "Les héparines sont obtenues :", o: ["Par synthèse totale", "Par extraction à partir d'organes animaux", "Par fermentation de champignons", "À partir d'algues brunes"], a: 1, e: "Intestin de porc, poumon de bœuf : pas d'autre méthode d'obtention." },
      { t: "qcm", q: "Qui contrôle les compléments alimentaires à base de plantes ?", o: ["L'ANSM (AMM)", "La DGCCRF (déclaration) et l'ANSES (nutrivigilance)", "L'EMA", "La HAS"], a: 1, e: "Les médicaments à base de plantes, eux, ont une AMM de l'ANSM et sont vendus en pharmacie." },
      { t: "qcm", q: "La lidocaïne est :", o: ["Un produit naturel non modifié", "Un dérivé hémisynthétique", "Une molécule de synthèse totale inspirée de la cocaïne", "Une molécule produite par biotechnologie"], a: 2, e: "La warfarine, inspirée du dicoumarol, est dans la même catégorie." },
      { t: "qcm", q: "La streptomycine est produite par :", o: ["Une plante", "Une bactérie du sol (Streptomyces)", "Un mollusque marin", "Le pancréas de porc"], a: 1, e: "C'est un antituberculeux de la famille des aminosides." },
      { t: "qcm", q: "La biotechnologie « rouge » concerne :", o: ["L'agriculture", "La santé (médicaments par micro-organismes modifiés)", "La mer", "La dépollution"], a: 1, e: "Verte = agriculture, blanche = industrie, bleue = mer, jaune = environnement." },
      { t: "vf", q: "Un complément alimentaire peut être injecté.", v: false, e: "Voie orale uniquement (voie cutanée pour les cosmétiques)." },
      { t: "vf", q: "La morphine est aujourd'hui produite par synthèse chimique totale.", v: false, e: "Elle est toujours extraite du pavot somnifère." },
      { t: "vf", q: "La méthode chimiotaxonomique est la moins utilisée actuellement.", v: true, e: "On lui préfère le criblage biologique, souvent après une sélection ethnopharmacologique." },
      { t: "vf", q: "Le marc est la drogue végétale épuisée par le solvant.", v: true, e: "On le jette après la filtration." }
    ] },

  /* ---------- 5. Sources du médicament 2 (S. Sahpaz) ---------- */
  { id: "p_nat2", subj: "maps", title: "Sources du médicament : produits de santé naturels 2 (S. Sahpaz)", parts: 1,

    notions: ["Métabolites primaires et métabolites spécialisés (secondaires)", "Lipides, dérivés d'acides aminés, glucides (glucosamine, alginates)", "Terpènes : artémisinine, paclitaxel, glycyrrhizine", "Polyphénols : diosmine", "Alcaloïdes : morphine, codéine, vinblastine", "Phytothérapie, aromathérapie, homéopathie : principes et limites"],
    cards: [
      ["Différence entre métabolites primaires et spécialisés ?", "Primaires : vitaux, chez toutes les espèces, en grande quantité. Spécialisés : défense et adaptation, propres à une espèce, souvent peu abondants, principale source de médicaments."],
      ["D'où vient la glucosamine et à quoi sert-elle ?", "De la chitine de l'exosquelette des crustacés ; arthrose légère à modérée du genou."],
      ["Indications des alginates ?", "Par voie orale : reflux gastro-œsophagien (film protecteur). Par voie externe : hémostatiques et cicatrisants."],
      ["Comment sont classés les terpènes ?", "Selon le nombre d'unités isoprène (C5) : mono C10, sesqui C15, di C20, sester C25, tri C30, tétra C40."],
      ["Pourquoi Pierre Potier a-t-il utilisé l'if européen ?", "L'if du Pacifique donnait très peu de taxol et mourait ; les feuilles de l'if européen fournissent un précurseur qui donne par hémisynthèse le docétaxel (et le paclitaxel)."],
      ["Quels sont les 3 principes de l'homéopathie ?", "Similitude, infinitésimalité, globalité."],
      ["Qu'est-ce qu'une huile essentielle ?", "Un mélange de substances odorantes volatiles obtenu par entraînement à la vapeur d'eau, surtout des monoterpènes."],
      ["Comment a été découverte la vinblastine ?", "Par hasard en 1958, en cherchant un antidiabétique dans la pervenche de Madagascar : les extraits faisaient chuter les globules blancs."],
      { t: "qcm", q: "L'artémisinine est :", o: ["Un alcaloïde", "Un sesquiterpène", "Un polyphénol", "Un polysaccharide"], a: 1, e: "Issue de l'armoise annuelle, elle a valu le prix Nobel 2015 ; antipaludique." },
      { t: "qcm", q: "Le paclitaxel est un :", o: ["Monoterpène", "Diterpène", "Triterpène", "Alcaloïde indolique"], a: 1, e: "Diterpène à squelette taxane, poison du fuseau." },
      { t: "qcm", q: "La diosmine est utilisée pour :", o: ["Le paludisme", "L'insuffisance veineuse", "La toux sèche", "L'arthrose"], a: 1, e: "Flavonoïde des agrumes, veinotonique et vasculoprotecteur." },
      { t: "qcm", q: "Quelle plante interagit avec de nombreux médicaments en diminuant leur efficacité ?", o: ["Le millepertuis", "Le fenouil", "Le gingembre", "La lavande vraie"], a: 0, e: "Le millepertuis est utilisé dans la dépression mineure." },
      { t: "qcm", q: "La codéine est :", o: ["Un antalgique de palier III", "Un antalgique de palier II et un antitussif", "Un anticancéreux", "Un anticoagulant"], a: 1, e: "La morphine est de palier III ; l'héroïne est un dérivé illicite." },
      { t: "qcm", q: "L'énoxolone (génine de la glycyrrhizine) s'utilise :", o: ["Par voie orale au long cours", "Uniquement par voie locale", "En injection", "Comme antipaludique"], a: 1, e: "Anti-inflammatoire pour la gorge, les gencives, les hémorroïdes ; toxique par voie orale prolongée." },
      { t: "vf", q: "Les alcaloïdes sont des composés azotés plutôt basiques.", v: true, e: "Sous forme de sels ils sont solubles dans l'eau ; sous forme de bases, dans les solvants apolaires." },
      { t: "vf", q: "L'artémisinine s'utilise seule pour éviter les résistances.", v: false, e: "Toujours en association avec un antipaludique au mécanisme différent (ex. pipéraquine)." },
      { t: "vf", q: "Une huile fixe et une huile essentielle, c'est la même chose.", v: false, e: "Huile fixe = triglycérides (pression à froid) ; huile essentielle = substances volatiles (entraînement à la vapeur)." },
      { t: "vf", q: "La phytothérapie peut soigner une maladie grave en France.", v: false, e: "Elle est réservée aux troubles bénins et fonctionnels." }
    ] },

  /* ---------- 6. Formes galéniques : les ingrédients (P. Odou) ---------- */
  { id: "p_ingr", subj: "maps", title: "Formes galéniques : les ingrédients (P. Odou)", parts: 1,
    src: NO_SUP + " La partie sur les excipients des comprimés vient de la fiche Supmed n°5 (granulation et compression).",
    files: [["CM vidéo (Moodle)", MOODLE_MAPS], ["Fiche Supmed granulation (excipients)", D("1sLQL_YrPnvkQqfk7cOGO4gxdtAdkzGae")]],
    notions: ["Médicament = substance(s) active(s) + excipients, mis en forme galénique", "Principe actif : DCI, propriétés à connaître", "Excipient : définition, qualité pharmaceutique, excipients à effet notoire", "Rôles des excipients des formes solides : diluants, liants, désagrégeants, lubrifiants", "Excipients des formes liquides, semi-solides, stériles"],
    cards: [
      ["De quoi est composé un médicament ?", "D'une ou plusieurs substances actives et d'excipients, présentés sous une forme galénique."],
      ["Qu'est-ce qu'un excipient ?", "Tout composant du médicament autre que la substance active : il aide à fabriquer, administrer, conserver ou libérer le PA sans effet thérapeutique propre."],
      ["Qu'est-ce qu'un excipient à effet notoire ? Donne 3 exemples.", "Un excipient qui impose des précautions chez certains patients et doit être signalé : lactose, éthanol, aspartame, parabènes, saccharose, gluten…"],
      ["Rôle d'un désagrégeant ?", "Gonfler au contact de l'eau pour faire éclater le comprimé et libérer le PA (amidon, carboxyméthylcellulose)."],
      ["Pourquoi ajoute-t-on le lubrifiant juste avant la compression ?", "Il doit rester en fine couche à la surface des grains pour faciliter l'écoulement et le démoulage, sans gêner la cohésion."],
      ["Que veut dire DCI ?", "Dénomination commune internationale : nom officiel du principe actif, fixé par l'OMS."],
      { t: "qcm", q: "Quel excipient est un lubrifiant ?", o: ["Lactose", "Stéarate de magnésium", "Polyvinylpyrrolidone", "Carboxyméthylcellulose"], a: 1, e: "Lactose = diluant, PVP = liant, carboxyméthylcellulose = désagrégeant." },
      { t: "qcm", q: "Pourquoi l'aspartame est-il un excipient à effet notoire ?", o: ["Il contient du gluten", "C'est une source de phénylalanine", "Il est alcoolisé", "Il est allergisant comme les parabènes"], a: 1, e: "Dangereux en cas de phénylcétonurie." },
      { t: "qcm", q: "Dans quelle proportion utilise-t-on les lubrifiants ?", o: ["0,5 à 2 %", "10 à 20 %", "30 %", "50 %"], a: 0, e: "Une fine couche suffit." },
      { t: "qcm", q: "Un isotonisant sert à :", o: ["Colorer la solution", "Rendre la solution de même osmolarité que le sang ou les larmes", "Faire mousser", "Ralentir la libération"], a: 1, e: "Indispensable pour les injectables et les collyres (NaCl, glucose)." },
      { t: "vf", q: "Un excipient doit en principe être dépourvu d'activité pharmacologique à la dose utilisée.", v: true, e: "Il ne soigne pas : il sert la formulation." },
      { t: "vf", q: "Les collyres unidoses contiennent toujours des conservateurs.", v: false, e: "Au contraire, l'intérêt des unidoses est de s'en passer (conservateurs irritants pour l'œil)." },
      { t: "vf", q: "Le lactose sert de diluant dans de nombreux comprimés.", v: true, e: "Il doit être signalé (excipient à effet notoire)." }
    ] },

    cards: [
      ["Quelles sont les 4 étapes du cycle de compression ?", "Remplissage, arasage, compression, éjection."],
      ["Machine alternative et machine rotative : qu'est-ce qui bouge ?", "Alternative : sabot mobile, matrice fixe (1500-6000 cp/h). Rotative : sabot fixe, matrice mobile (centaines de milliers par heure)."],
      ["Pourquoi granuler une poudre avant de la comprimer ?", "Pour améliorer sa fluidité et sa compressibilité, chasser l'air et limiter le démélange."],
      ["Quelles sont les étapes de la granulation humide ?", "Mouillage, granulation (granulateur oscillant), séchage (étuve ou lit d'air fluidisé), tamisage puis ajout du lubrifiant."],
      ["Quand utilise-t-on la granulation sèche ?", "Quand le PA ne supporte pas l'eau (hydrolysable) ou la chaleur du séchage (thermolabile) : compactage en briquettes ou plaquettes puis broyage."],
      ["Différence entre conditionnement primaire et secondaire ?", "Primaire : en contact avec le médicament (blister, flacon, ampoule). Secondaire : boîte extérieure avec la notice."],
      ["Qui est responsable de la libération d'un lot de médicaments ?", "Le pharmacien responsable de l'établissement pharmaceutique, après le contrôle qualité."],
      { t: "qcm", q: "Une machine rotative a :", o: ["Un sabot mobile et une matrice fixe", "Un sabot fixe et une matrice mobile", "Un sabot et une matrice fixes", "Un seul poinçon"], a: 1, e: "C'est l'inverse pour la machine alternative." },
      { t: "qcm", q: "Le comportement idéal d'une poudre à comprimer est :", o: ["Élastique", "Plastique", "Friable", "Collant"], a: 1, e: "Plastique : l'énergie sert à déformer et à créer des liens permanents (balle de ping-pong)." },
      { t: "qcm", q: "Les granulés « en croûtes » sont obtenus avec :", o: ["Un solvant (eau, éthanol)", "Un liquide agglutinant (PVP)", "Un compacteur", "Un lubrifiant"], a: 0, e: "Avec un liquide agglutinant, on obtient des granulés agglutinés." },
      { t: "qcm", q: "Laquelle est une forme pour la voie parentérale ?", o: ["Gélule", "Lyophilisat pour solution injectable", "Ovule", "Sirop"], a: 1, e: "Les formes parentérales sont stériles et apyrogènes." },
      { t: "qcm", q: "Que trouve-t-on sur le conditionnement primaire d'un blister ?", o: ["Seulement la notice", "Le nom, le dosage, le lot et la péremption", "Rien", "Le prix"], a: 1, e: "Le numéro de lot et la péremption permettent la traçabilité." },
      { t: "vf", q: "La compression directe est la stratégie la plus rapide et la moins chère.", v: true, e: "Mais elle n'est possible que si la poudre s'écoule et se comprime bien." },
      { t: "vf", q: "Un comprimé doit être le plus dur possible.", v: false, e: "Assez dur pour le transport, mais pas trop pour pouvoir se désagréger dans le tube digestif." },
      { t: "vf", q: "Le lit d'air fluidisé permet de mouiller, granuler et sécher dans le même appareil.", v: true, e: "Plus cher, mais on évite les transferts entre 3 appareils." }

  /* ---------- 8. Opérations pharmaceutiques (J. Siepmann) ---------- */
  { id: "p_ops", subj: "maps", title: "Les opérations pharmaceutiques (J. Siepmann)", parts: 2,
    src: "Fiche Supmed 2022-2023 n°1 « Les opérations pharmaceutiques », parties 1 et 2.",
    files: [["Fiche Supmed partie 1", D("1XyLYILb935OhPiJNv8hf8axJ7jhrQ175")], ["Fiche Supmed partie 2", D("16CyRCWHW7sMiVPDHcwvy71lpYJB4AZuB")], ["QCM sujet", D("1i-nszLoQEaOGG1jqHooK2EtDlIy4OZM7")], ["QCM corrigé", D("1MHuLkd8CvWtwxiQTQpZIS77WgeUO2rxF")], ["Annales classées (sujet)", D("11wjyPRp3KzdnJOhOfxo83YII7hIkHHkL")], ["Annales classées (corrigé)", D("1MLwphZLjHPIdMRPkQyVw5VJ-JanUG6Av")], ["CM vidéo (Moodle)", MOODLE_MAPS]],
    notions: ["Dessiccation : types d'eau, loi de Dalton, croûtage, méthodes, lyophilisation, contrôles", "Broyage : tailles, intérêts, choix du broyeur, mécanismes et appareils, tamisage", "Mélange : homogénéité, démélange, facteurs, mélangeurs, contrôle", "Dissolution : loi de Noyes-Whitney, solubilité, pH, polymorphisme", "Dissolution extractive : macération, digestion, décoction, infusion, lixiviation", "Filtration : criblage et adsorption, filtration stérilisante 0,22 µm, point de bulle"],
    cards: [
      ["Écris la loi de Dalton et explique Pm et Pt.", "M = k·S·(Pm − Pt)/P. Pm : tension de vapeur saturante (augmente avec la température) ; Pt : pression partielle de vapeur d'eau de l'air ambiant."],
      ["Comment accélérer un séchage d'après la loi de Dalton ?", "Augmenter la surface (étaler), la température, diminuer la pression partielle de vapeur (évacuer les vapeurs) et la pression totale (vide partiel)."],
      ["Qu'est-ce que le croûtage ?", "Une croûte sèche en surface qui retient l'eau à l'intérieur, quand l'évaporation est plus rapide que la diffusion de l'eau dans le solide."],
      ["Quelles sont les 3 étapes de la lyophilisation ?", "Congélation, sublimation, condensation."],
      ["Quelle est la méthode de référence pour doser l'eau résiduelle ?", "Le titrage de Karl Fischer."],
      ["Donne les seuils de taille de la pulvérisation, de la micronisation et du nanobroyage.", "< 1250 µm, < 10 µm, < 100 nm."],
      ["Quel mécanisme de broyage pour une substance fibreuse ? Et molle ou pâteuse ?", "Fibreuse : cisaillement ou arrachement. Molle ou pâteuse : attrition (écrasement + cisaillement)."],
      ["Écris la loi de Noyes-Whitney.", "Vd = K × S × (Cs − C) : vitesse de dissolution, surface de contact, concentration à saturation, concentration à l'instant t."],
      ["Quelle est la taille des pores d'une filtration stérilisante ?", "0,22 µm."],
      ["Qu'est-ce que le point de bulle ?", "La pression à appliquer pour voir apparaître les premières bulles à travers le filtre : il vérifie l'intégrité du filtre avant et après la filtration."],
      ["Différence entre décoction et infusion ?", "Décoction : la drogue est maintenue dans l'eau à ébullition (15-30 min). Infusion : on verse l'eau bouillante sur la drogue et on laisse refroidir."],
      { t: "qcm", q: "Quelle eau est la plus difficile à éliminer sans abîmer le produit ?", o: ["L'eau libre", "L'eau d'adsorption", "L'eau de cristallisation", "L'eau de lavage"], a: 2, e: "Elle fait partie du cristal : l'enlever casse la structure cristalline." },
      { t: "qcm", q: "Quel séchoir évite le croûtage grâce à un air de plus en plus chaud et sec ?", o: ["Séchoir discontinu", "Séchoir à bandes à contre-courant", "Armoire à vide", "Lampes infrarouges"], a: 1, e: "Le produit et l'air circulent en sens opposé." },
      { t: "qcm", q: "Le broyeur à boulets est déconseillé pour les produits :", o: ["Durs", "Thermosensibles", "Secs", "Minéraux"], a: 1, e: "Il fournit beaucoup d'énergie et chauffe beaucoup (réaction exothermique)." },
      { t: "qcm", q: "Un broyeur à couteaux ou à hélices agit par :", o: ["Écrasement seul", "Percussion et cisaillement", "Attrition", "Arrachement"], a: 1, e: "Notion tombée 3 fois au concours d'après Supmed." },
      { t: "qcm", q: "Liquide + grande quantité de solide insoluble donne :", o: ["Une suspension", "Une émulsion", "Une pâte (malaxage)", "Une solution"], a: 2, e: "Peu de solide insoluble donnerait une suspension." },
      { t: "qcm", q: "La solubilité d'une base faible augmente quand :", o: ["Le pH augmente", "Le pH diminue", "La viscosité augmente", "La surface diminue"], a: 1, e: "Une base faible s'ionise en milieu acide ; un acide faible, en milieu basique." },
      { t: "qcm", q: "La macération se fait :", o: ["À ébullition", "À température ambiante", "Entre 25 et 100 °C pendant 1 à 15 h", "À froid de haut en bas dans une colonne"], a: 1, e: "Digestion = 25-100 °C ; lixiviation = à froid, de haut en bas." },
      { t: "qcm", q: "Un filtre en profondeur retient les particules par :", o: ["Criblage uniquement", "Adsorption électrostatique", "Osmose", "Centrifugation"], a: 1, e: "Un changement de débit ou de pression peut provoquer un relargage." },
      { t: "qcm", q: "Pour un mélange de poudres, le dosage du PA doit être compris entre :", o: ["50 et 150 %", "90 et 110 % en industrie", "95 et 105 %", "99 et 101 %"], a: 2, e: "± 5 % (± 10 % toléré à l'hôpital)." },
      { t: "vf", q: "La lyophilisation utilise le point triple de l'eau pour passer de la glace à la vapeur sans état liquide.", v: true, e: "C'est une sublimation." },
      { t: "vf", q: "Une forme amorphe est moins soluble qu'une forme cristalline.", v: false, e: "Plus la cristallinité est faible, plus le produit est soluble (ex. insuline rapide)." },
      { t: "vf", q: "Une particule sphérique est la forme idéale pour un bon mélange.", v: true, e: "Les particules isométriques s'écoulent mieux et se bloquent moins." },
      { t: "vf", q: "Augmenter la viscosité accélère la dissolution.", v: false, e: "Le liquide se renouvelle moins à la surface du solide : la dissolution ralentit." },
      { t: "vf", q: "L'élévation de la température et de la différence de pression facilitent la filtration.", v: true, e: "Quand le produit supporte la chaleur." }
    ] },

  { id: "p_parent", subj: "maps", title: "Les voies d'administration : voie parentérale (T. Dine)", parts: 1,

    notions: ["Voies entérales et parentérales ; effet systémique ou local", "Pourquoi remplacer la voie orale", "Voie transdermique (patchs) et intradermique (BCG)", "Voies sous-cutanée et intramusculaire", "Voies intraveineuse (biodisponibilité 100 %) et artérielle", "Voies locales : pulmonaire, nasale, oculaire, vaginale, cutanée…"],
    cards: [
      ["Que signifie « parentérale » ?", "Para = à côté : toutes les voies qui ne passent pas par le tube digestif."],
      ["Quels sont les avantages d'un patch transdermique ?", "Observance, discrétion, libération lente et constante sans pic, pas d'effet de premier passage intestinal ni hépatique."],
      ["Pourquoi ne faut-il jamais couper un patch ?", "La matrice fuit : perte d'efficacité et dose incontrôlée."],
      ["Quel est le seul vaccin injecté en intradermique ?", "Le BCG (tuberculose), sur la face postéro-externe du bras."],
      ["Citez 3 médicaments injectés en sous-cutanée.", "Insuline, héparines de bas poids moléculaire, morphine (aussi EPO, certains vaccins)."],
      ["Où peut-on faire une injection intramusculaire ? Quelle précaution chez l'enfant ?", "Deltoïde, moyen fessier, vaste externe de la cuisse. Jamais dans la fesse avant 2 ans (nerf sciatique)."],
      ["Qu'est-ce qu'un bolus ?", "Une injection IV directe rapide (flash), en moins d'une minute, pour les urgences (ex. adrénaline dans l'arrêt cardiaque)."],
      ["Qu'est-ce qu'une extravasation ?", "Le produit injecté passe hors de la veine et diffuse dans les tissus (toxicité, fibrose)."],
      ["Pourquoi la voie pulmonaire est-elle rapide mais peu précise ?", "Muqueuse très fine et immense surface d'échange, mais seulement 10 à 20 % de la dose atteint les alvéoles."],
      { t: "qcm", q: "Quelle voie a une biodisponibilité de 100 % ?", o: ["Sous-cutanée", "Intramusculaire", "Intraveineuse", "Transdermique"], a: 2, e: "Le PA est injecté directement dans la circulation : pas d'étape d'absorption." },
      { t: "qcm", q: "Laquelle n'est PAS une voie d'urgence ?", o: ["Intraveineuse", "Pulmonaire", "Sous-cutanée", "Nasale (effet rapide)"], a: 2, e: "La résorption sous-cutanée est lente et progressive." },
      { t: "qcm", q: "Que ne peut-on JAMAIS injecter en intraveineuse ?", o: ["Une solution isotonique", "Une émulsion huile dans eau", "Une solution huileuse", "Du NaCl 0,9 %"], a: 2, e: "Les solutions huileuses passent en intramusculaire, jamais en IV." },
      { t: "qcm", q: "Le fentanyl en patch se change toutes les :", o: ["24 h", "48 h", "72 h", "Semaines"], a: 2, e: "Il est 100 fois plus actif que la morphine." },
      { t: "qcm", q: "Quel facteur augmente la résorption transdermique ?", o: ["Une peau sèche et âgée", "Une température corporelle élevée", "Une peau épaisse", "Un PA très ionisé"], a: 1, e: "Seule la forme non ionisée traverse ; une peau lésée ou rasée absorbe aussi plus vite." },
      { t: "qcm", q: "Le Nexplanon® est :", o: ["Un patch contraceptif", "Un implant sous-cutané contraceptif de 3 ans", "Un anneau vaginal", "Un implant biodégradable contre le cancer de la prostate"], a: 1, e: "Non biodégradable et radio-opaque ; Zoladex® = implant biodégradable (prostate)." },
      { t: "qcm", q: "Un collyre bêtabloquant contre le glaucome peut provoquer :", o: ["Une hypertension", "Une baisse de la pression artérielle", "Une hyperglycémie", "Rien en dehors de l'œil"], a: 1, e: "La muqueuse oculaire est très vascularisée : effets systémiques possibles." },
      { t: "vf", q: "L'intramusculaire accepte des solutions aqueuses et huileuses.", v: true, e: "Les formes huileuses servent souvent de formes retard." },

      { t: "vf", q: "La voie auriculaire peut être utilisée pour un effet systémique.", v: false, e: "Uniquement un effet local." }

  { id: "p_enter", subj: "maps", title: "Les voies d'administration : voie entérale (L. Nawrocki)", parts: 1,
